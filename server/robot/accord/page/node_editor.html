<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Robot 节点编辑器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:#1e1e1e;color:#ccc}

/* ===== 顶栏 ===== */
#toolbar{height:48px;background:#252526;display:flex;align-items:center;padding:0 12px;gap:6px;border-bottom:1px solid #3e3e42;flex-shrink:0}
#toolbar button{background:#0e639c;color:#fff;border:none;padding:5px 14px;border-radius:3px;cursor:pointer;font-size:12px;white-space:nowrap}
#toolbar button:hover{background:#1177bb}
#toolbar button.gray{background:#3e3e42;color:#ccc}
#toolbar button.gray:hover{background:#4e4e57}
#toolbar .sep{width:1px;height:24px;background:#464647;margin:0 4px}
#toolbar label{color:#999;font-size:12px}
#toolbar input{background:#1e1e1e;color:#ccc;border:1px solid #464647;border-radius:3px;padding:4px 8px;font-size:12px;font-family:inherit}
#toolbar input[type=text]{width:160px}

/* ===== 主体 ===== */
#main{flex:1;display:flex;overflow:hidden}

/* 左侧节点面板 */
#palette{width:165px;background:#252526;border-right:1px solid #3e3e42;overflow-y:auto;flex-shrink:0;padding:6px}
#palette h3{color:#888;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin:8px 4px 4px}
.palette-item{display:flex;align-items:center;gap:8px;padding:7px 8px;margin:2px 0;border-radius:4px;cursor:grab;border:1px solid transparent;transition:background .12s}
.palette-item:hover{background:#2d2d30;border-color:#464647}
.palette-item:active{cursor:grabbing}
.palette-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.2)}
.palette-item span{color:#ccc;font-size:12px}

/* 画布 */
#canvas-wrap{flex:1;position:relative;overflow:auto;background:#1e1e1e}
#canvas-wrap::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#2a2a2c 1px,transparent 1px);background-size:18px 18px;width:100%;height:100%;pointer-events:none}
#canvas{position:relative;width:4000px;height:3000px}
#svg-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#svg-layer path{pointer-events:stroke;cursor:pointer}

/* 节点 */
.node{position:absolute;min-width:155px;background:#2d2d30;border:1px solid #55555a;border-radius:6px;overflow:visible;box-shadow:0 2px 10px rgba(0,0,0,.35);user-select:none;transition:border-color .1s}
.node:hover{border-color:#6a6a6e}
.node.selected{border-color:#007acc;box-shadow:0 0 0 1px #007acc,0 2px 10px rgba(0,0,0,.35)}
.node-head{padding:6px 10px;color:#fff;font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px;cursor:move;white-space:nowrap;border-radius:5px 5px 0 0}
.node-head .nicon{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.node-head .nid{margin-left:auto;background:rgba(255,255,255,.15);padding:0 6px;border-radius:8px;font-size:10px;font-weight:400}
.node-head .root-badge{background:#007acc;padding:0 5px;border-radius:8px;font-size:9px;font-weight:600}
.node-body{padding:4px 0 6px}
.node-field{padding:2px 14px 2px 10px;color:#888;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.node-field .k{color:#9cdcfe}
.node-field .v{color:#ce9178}
.node-field .empty{color:#555;font-style:italic}

/* 端口圆点（绘制在节点上，位置随连线路由同步） */
.port-dot{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid #1e1e1e;z-index:6}
.port-dot.out{background:#f0a020;cursor:crosshair}
.port-dot.out:hover{transform:scale(1.35)}
.port-dot.out.dragging{box-shadow:0 0 0 2px rgba(240,160,32,.45)}
.port-dot.in{background:#4ec9b0;pointer-events:none}
.port-dot-label{position:absolute;font-size:9px;color:#ccc;background:rgba(37,37,38,.92);padding:0 3px;border-radius:2px;white-space:nowrap;pointer-events:none;z-index:6;line-height:14px}
body.connecting .node{border-color:#2a6f97}

/* 用例选择列表（打开用例） */
.case-list{max-height:400px;overflow-y:auto}
.case-item{padding:8px 10px;border:1px solid #3e3e42;border-radius:4px;margin-bottom:4px;cursor:pointer;transition:background .12s,border-color .12s}
.case-item:hover{background:#2d2d30;border-color:#007acc}
.case-item .case-name{color:#ccc;font-size:13px;display:block}
.case-item .case-path{color:#666;font-size:10px;display:block;margin-top:2px}
.workdir-label{color:#888;font-size:11px;margin-left:2px;white-space:nowrap}

/* 连线 */
.conn-path{fill:none;stroke:#4ec9b0;stroke-width:2;transition:stroke .1s}
.conn-path.selected{stroke:#007acc;stroke-width:3}
.conn-temp{fill:none;stroke:#007acc;stroke-width:2;stroke-dasharray:5;pointer-events:none}

/* 右侧属性面板 */
#props{width:310px;background:#252526;border-left:1px solid #3e3e42;overflow-y:auto;flex-shrink:0;padding:10px}
#props h2{color:#ccc;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
#props h2 .dot{width:10px;height:10px;border-radius:50%}
#props .field{margin-bottom:12px}
#props .field>label{display:block;color:#9cdcfe;font-size:11px;margin-bottom:3px;font-weight:600}
#props .field input[type=text],#props .field input[type=number],#props .field textarea,#props .field select{
  width:100%;background:#1e1e1e;color:#ccc;border:1px solid #464647;border-radius:3px;padding:5px 7px;font-size:12px;font-family:inherit}
#props .field textarea{min-height:55px;resize:vertical;font-family:'Consolas','Courier New',monospace;font-size:11px}
#props .field input:focus,#props .field textarea:focus,#props .field select:focus{outline:none;border-color:#007acc}
#props .io-row{display:flex;gap:3px;margin-bottom:3px}
#props .io-row select{width:62px;flex-shrink:0}
#props .io-row input{flex:1;min-width:0}
/* 参数卡片：上行 名称+类型+删除，下行 取值 */
#props .kv2{border:1px solid #3e3e42;border-radius:3px;padding:4px;margin-bottom:4px;background:#1b1b1c}
#props .kv2-row1{display:flex;gap:3px;margin-bottom:3px}
#props .kv2-row1 .kv-key{flex:1;min-width:0}
#props .kv2-row1 select{width:66px;flex-shrink:0}
#props .kv2-tag{color:#9cdcfe;font-size:11px;font-weight:600;align-self:center;padding:0 2px;flex-shrink:0}
#props .kv2 .kv-val{width:100%;font-family:'Consolas','Courier New',monospace;font-size:11px}
#props .kv2 .del-btn{width:22px;height:24px;flex-shrink:0;background:#3e3e42;color:#ccc;border:none;border-radius:3px;cursor:pointer;font-size:13px;line-height:1}
#props .kv2 .del-btn:hover{background:#a1260d;color:#fff}
#props .kv-empty{color:#555;font-size:11px;margin:2px 0 4px;font-style:italic}
#props .add-btn{background:#37373d;color:#ccc;border:1px solid #464647;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:11px;margin-top:2px}
#props .add-btn:hover{background:#4e4e57}
#props .target-row{display:flex;gap:4px;margin-bottom:4px;align-items:center;font-size:11px;color:#888}
#props .target-row input{width:50px;flex-shrink:0;background:#1e1e1e;color:#ccc;border:1px solid #464647;border-radius:3px;padding:3px 5px;font-size:11px}
#props .target-row .target-to{color:#4ec9b0;flex:1}
#props .empty-prop{color:#666;text-align:center;padding:60px 20px;line-height:1.8}
#props .adv-toggle{color:#888;font-size:11px;cursor:pointer;margin:8px 0 4px;display:block}
#props .adv-toggle:hover{color:#ccc}
#props .adv-fields{display:none;padding-top:4px;border-top:1px solid #3e3e42}
#props .adv-fields.show{display:block}
#props .btn-row{display:flex;gap:6px;margin-top:8px}
#props .btn-row button{flex:1;padding:5px;border-radius:3px;border:1px solid #464647;background:#3e3e42;color:#ccc;cursor:pointer;font-size:11px}
#props .btn-row button:hover{background:#4e4e57}
#props .btn-row button.danger:hover{background:#a1260d;color:#fff}

/* 模态框 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:#252526;border:1px solid #464647;border-radius:8px;width:620px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.modal-head{padding:12px 16px;border-bottom:1px solid #3e3e42;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{color:#ccc;font-size:14px}
.modal-head .close{background:none;border:none;color:#999;cursor:pointer;font-size:18px}
.modal-body{padding:12px 16px;overflow-y:auto;flex:1}
.modal-body textarea{width:100%;height:340px;background:#1e1e1e;color:#ccc;border:1px solid #464647;border-radius:4px;padding:8px;font-family:'Consolas','Courier New',monospace;font-size:12px;resize:vertical}
.modal-foot{padding:10px 16px;border-top:1px solid #3e3e42;display:flex;justify-content:flex-end;gap:8px}
.modal-foot button{padding:6px 16px;border-radius:3px;border:none;cursor:pointer;font-size:12px}
.modal-foot .primary{background:#0e639c;color:#fff}
.modal-foot .primary:hover{background:#1177bb}
.modal-foot .secondary{background:#3e3e42;color:#ccc;border:1px solid #555}
.modal-foot .secondary:hover{background:#4e4e57}

/* 提示 */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0e639c;color:#fff;padding:8px 20px;border-radius:4px;font-size:12px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- 顶栏 -->
<div id="toolbar">
  <button onclick="exportModal('json')">导出 JSON</button>
  <button onclick="exportModal('lua')">导出 Lua</button>
  <button class="gray" onclick="saveEditorFile()">保存</button>
  <button class="gray" onclick="openCaseFile()">打开</button>
  <button class="gray" onclick="loadExample()">加载示例</button>
  <button class="gray" onclick="pickWorkDir()">工作目录</button>
  <span id="workdir-label" class="workdir-label">未设置</span>
  <div class="sep"></div>
  <label>用例名称</label>
  <input type="text" id="case-name" value="untitled" oninput="state.caseName=this.value">
  <div class="sep"></div>
  <button class="gray" onclick="clearAll()">清空</button>
</div>

<!-- 主体 -->
<div id="main">
  <!-- 左侧节点面板 -->
  <div id="palette">
    <h3>节点类型</h3>
    <div id="palette-list"></div>
  </div>

  <!-- 画布 -->
  <div id="canvas-wrap">
    <div id="canvas">
      <svg id="svg-layer"></svg>
    </div>
  </div>

  <!-- 右侧属性面板 -->
  <div id="props">
    <div class="empty-prop" id="prop-empty">
      点击节点编辑属性<br>右键节点可设为根节点
    </div>
    <div id="prop-content" style="display:none"></div>
  </div>
</div>

<!-- 模态框容器 -->
<div id="modal-container"></div>
<!-- 提示 -->
<div id="toast"></div>

<script>
// ============================================================
//  节点类型定义
// ============================================================
const NODE_TYPES = {
  SOCK: {
    label: "Socket连接", color: "#4caf50",
    outputs: [{id:"next",label:"Next"}],
    fields: [
      {key:"ip",   label:"IP地址",  render:"input"},
      {key:"port", label:"端口",    render:"input"},
    ]
  },
  REQ: {
    label: "协议请求", color: "#2196f3",
    outputs: [{id:"next",label:"Next"}],
    fields: [
      {key:"cmd_id",  label:"协议ID",   render:"text"},
      {key:"inputs",  label:"输入参数", render:"kv"},
      {key:"outputs", label:"输出参数", render:"kv"},
    ]
  },
  NTF: {
    label: "等待通知", color: "#9c27b0",
    outputs: [{id:"next",label:"Next"}],
    fields: [
      {key:"cmd_id",  label:"协议ID",     render:"text"},
      {key:"cond",    label:"条件(Lua)",  render:"textarea"},
      {key:"outputs", label:"输出参数",   render:"kv"},
    ]
  },
  GM: {
    label: "GM命令", color: "#ff5722",
    outputs: [{id:"next",label:"Next"}],
    fields: [
      {key:"cmds", label:"命令列表", render:"list"},
      {key:"time", label:"延迟(ms)", render:"number"},
    ]
  },
  COND: {
    label: "条件分支", color: "#ff9800",
    outputs: [{id:"success",label:"成功"},{id:"failed",label:"失败"}],
    fields: [
      {key:"cond", label:"条件表达式(Lua)", render:"textarea"},
    ]
  },
  CASE: {
    label: "子用例", color: "#00bcd4",
    outputs: [{id:"next",label:"Next"}],
    fields: [
      {key:"case",    label:"用例名称", render:"case-select"},
      {key:"in_args", label:"输入参数", render:"kv-raw"},
    ]
  },
  WAIT: {
    label: "等待", color: "#607d8b",
    outputs: [{id:"next",label:"Next"}],
    fields: [
      {key:"time", label:"等待(ms)",   render:"number"},
      {key:"cond", label:"条件(Lua)",  render:"textarea"},
    ]
  },
  SCRIPT: {
    label: "脚本", color: "#e91e63",
    outputs: [{id:"next",label:"Next"}],
    fields: [
      {key:"script",  label:"Lua脚本",   render:"textarea"},
      {key:"outputs", label:"输出参数",  render:"kv"},
    ]
  },
  SWITCH: {
    label: "开关分支", color: "#795548",
    outputs: "dynamic",
    fields: [
      {key:"inputs", label:"输入参数",   render:"kv"},
    ]
  },
};

const TYPE_OPTIONS = ["attr","var","lua","const"];

// ============================================================
//  状态管理
// ============================================================
let state = {
  caseName: "untitled",
  nodes: {},          // {id: {type, x, y, data:{...}}}
  connections: [],    // [{from, port, to}]
  selected: null,     // 选中的节点id
  selectedConn: null, // 选中的连线index
  root: null,
  rewind: null,
  nextId: 1,
};

let drag = null;    // 节点拖拽 {id, offsetX, offsetY}
let connDrag = null; // 连线拖拽 {fromId, port, x, y}

const $ = id => document.getElementById(id);
const canvas = $('canvas');
const svg = $('svg-layer');
const canvasWrap = $('canvas-wrap');

// ============================================================
//  初始化
// ============================================================
function init() {
  // 渲染节点面板
  const palList = $('palette-list');
  for (const [type, def] of Object.entries(NODE_TYPES)) {
    const el = document.createElement('div');
    el.className = 'palette-item';
    el.innerHTML = `<div class="dot" style="background:${def.color}"></div><span>${def.label}</span>`;
    el.onmousedown = e => { e.preventDefault(); createNode(type, e); };
    palList.appendChild(el);
  }

  // 画布点击空白处取消选中
  canvas.onmousedown = e => {
    if (e.target === canvas || e.target === canvasWrap || e.target === svg) {
      selectNode(null);
      state.selectedConn = null;
      renderConnections();
    }
  };

  // 键盘删除
  document.onkeydown = e => {
    if ((e.key === 'Delete' || e.key === 'Backspace') && document.activeElement === document.body) {
      if (state.selectedConn !== null) {
        state.connections.splice(state.selectedConn, 1);
        state.selectedConn = null;
        renderAll();
      } else if (state.selected !== null) {
        deleteNode(state.selected);
      }
    }
  };

  updateWorkDirLabel();
  loadExample();
}

// ============================================================
//  创建节点
// ============================================================
function createNode(type, mouseEvent) {
  const id = state.nextId++;
  // 在画布可视区域居中创建，避免被左侧面板遮挡
  const cnt = Object.keys(state.nodes).length;
  const x = canvasWrap.scrollLeft + canvasWrap.clientWidth / 2 - 80 + (cnt % 3) * 30;
  const y = canvasWrap.scrollTop + canvasWrap.clientHeight / 2 - 30 + Math.floor(cnt / 3) * 30;
  const def = NODE_TYPES[type];

  // 初始化data
  const data = {};
  for (const f of def.fields) {
    if (f.render === 'kv') data[f.key] = {};
    else if (f.render === 'kv-raw') data[f.key] = {};
    else if (f.render === 'list') data[f.key] = [];
    else if (f.render === 'number') data[f.key] = 0;
    else if (f.render === 'input') data[f.key] = {type:"attr", value:""};
    else data[f.key] = "";
  }
  // SWITCH 默认分支
  if (type === 'SWITCH') data._targetKeys = ["1"];

  state.nodes[id] = {type, x, y, data};
  if (state.root === null) state.root = id;
  renderAll();
  selectNode(id);
}

// ============================================================
//  渲染
// ============================================================
function renderAll() {
  renderNodes();
  renderPorts();
  renderConnections();
}

function renderNodes() {
  // 移除旧节点DOM
  canvas.querySelectorAll('.node').forEach(n => n.remove());
  for (const [idStr, node] of Object.entries(state.nodes)) {
    const id = parseInt(idStr);
    const def = NODE_TYPES[node.type];
    const el = document.createElement('div');
    el.className = 'node' + (state.selected === id ? ' selected' : '');
    el.style.left = node.x + 'px';
    el.style.top = node.y + 'px';
    el.dataset.id = id;

    // 头部
    let headHtml = `<div class="node-head" style="background:${def.color}">
      <div class="nicon" style="background:rgba(255,255,255,.7)"></div>
      <span>${def.label}</span>
      ${state.root === id ? '<span class="root-badge">ROOT</span>' : ''}
      <span class="nid">#${id}</span>
    </div>`;

    // 字段预览
    let bodyHtml = '<div class="node-body">';
    for (const f of def.fields) {
      const val = node.data[f.key];
      let display = '';
      if (f.render === 'kv' || f.render === 'kv-raw') {
        const keys = Object.keys(val || {});
        display = keys.length ? keys.map(k => {
          if (f.render === 'kv-raw') return k;
          return k + '←' + (val[k]?.value || '?');
        }).join(', ') : '';
      } else if (f.render === 'input') {
        display = (val?.type || '?') + ': ' + (val?.value || '');
      } else if (f.render === 'list') {
        display = (val || []).length + '条命令';
      } else if (f.render === 'textarea') {
        display = val ? String(val).substring(0, 30) : '';
      } else {
        display = val !== undefined && val !== '' ? String(val) : '';
      }
      bodyHtml += `<div class="node-field"><span class="k">${f.label}</span>: <span class="${display?'v':'empty'}">${display||'未设置'}</span></div>`;
    }
    // SWITCH 分支预览
    if (node.type === 'SWITCH') {
      const tk = node.data._targetKeys || [];
      bodyHtml += `<div class="node-field"><span class="k">分支</span>: <span class="${tk.length?'v':'empty'}">${tk.length?tk.join(', '):'未设置'}</span></div>`;
    }
    bodyHtml += '</div>';

    el.innerHTML = headHtml + bodyHtml;

    canvas.appendChild(el);

    // 事件（端口圆点由 renderPorts 绘制并绑定）
    el.querySelector('.node-head').onmousedown = e => startDragNode(e, id);
    el.onmousedown = e => {
      if (e.target.closest('.port-dot')) return;
      e.stopPropagation();
      selectNode(id);
    };
    el.oncontextmenu = e => { e.preventDefault(); showContextMenu(e, id); };
  }
}

// ============================================================
//  四方向连线路由 + SVG端点绘制
// ============================================================

function nodeBounds(nodeId) {
  const node = state.nodes[nodeId];
  if (!node) return null;
  const el = canvas.querySelector(`.node[data-id="${nodeId}"]`);
  const w = el ? el.offsetWidth : 160;
  const h = el ? el.offsetHeight : 60;
  return { x: node.x, y: node.y, w, h, cx: node.x + w / 2, cy: node.y + h / 2 };
}

// 插座中心到边框的外偏移：插座整体绘制在边框之外，不与节点内容重叠
const PORT_OFF = 8;

function sidePoint(b, side, frac = 0.5) {
  // frac 0..1 沿边分布位置；返回边框外侧的插座中心坐标
  switch (side) {
    case 'right':  return { x: b.x + b.w + PORT_OFF, y: b.y + b.h * frac };
    case 'left':   return { x: b.x - PORT_OFF,       y: b.y + b.h * frac };
    case 'bottom': return { x: b.x + b.w * frac,     y: b.y + b.h + PORT_OFF };
    case 'top':    return { x: b.x + b.w * frac,     y: b.y - PORT_OFF };
  }
}

function oppositeSide(side) {
  return { right: 'left', left: 'right', top: 'bottom', bottom: 'top' }[side];
}

// ============================================================
//  端口布局：连线端点与节点圆点共用同一套 side/frac，保证位置同步
// ============================================================
// layout[nodeId] = { outs: {portId:{label, pos:{side,frac}|null}}, ins: {[side]:{frac}} }
function computePortLayout() {
  const layout = {};
  for (const [idStr, node] of Object.entries(state.nodes)) {
    const id = parseInt(idStr);
    const def = NODE_TYPES[node.type];
    let outPorts = def.outputs;
    if (node.type === 'SWITCH') {
      outPorts = (node.data._targetKeys || []).map((k, i) => ({id:`target_${i}`, label:String(k)}));
    }
    const outs = {};
    outPorts.forEach(p => { outs[p.id] = { label: p.label, pos: null }; });
    layout[id] = { outs, ins: {} };
  }

  // 统计每个节点每条边上的出入方向数量，并记录每个输出端口所在的边
  const outCnt = {}, inCnt = {}, portSide = {};
  const sidesArr = state.connections.map(conn => calcConnSides(conn.from, conn.to));
  state.connections.forEach((conn, i) => {
    const s = sidesArr[i];
    if (!s) return;
    outCnt[conn.from] = outCnt[conn.from] || {};
    outCnt[conn.from][s.fromSide] = (outCnt[conn.from][s.fromSide] || 0) + 1;
    inCnt[conn.to] = inCnt[conn.to] || {};
    inCnt[conn.to][s.toSide] = (inCnt[conn.to][s.toSide] || 0) + 1;
    portSide[conn.from] = portSide[conn.from] || {};
    portSide[conn.from][conn.port] = s.fromSide;
  });

  // 区间内均匀取点
  function spreadFracs(n, a, b) {
    if (n <= 1) return [(a + b) / 2];
    const res = [];
    for (let i = 0; i < n; i++) res.push(a + (b - a) * i / (n - 1));
    return res;
  }

  for (const [idStr, lay] of Object.entries(layout)) {
    const id = parseInt(idStr);
    const oc = outCnt[id] || {}, ic = inCnt[id] || {};
    const ps = portSide[id] || {};
    // 输出端口按所在边分组；同边有输入时输出让出尾部区间，与输入插座分区隔离
    const buckets = {};
    Object.entries(lay.outs).forEach(([portId]) => {
      const side = ps[portId];
      if (!side) return;
      (buckets[side] = buckets[side] || []).push(portId);
    });
    for (const [side, portIds] of Object.entries(buckets)) {
      const zone = ic[side] ? [0.15, 0.6] : [0.2, 0.8];
      const fracs = spreadFracs(portIds.length, zone[0], zone[1]);
      portIds.forEach((portId, i) => {
        lay.outs[portId].pos = { side, frac: fracs[i] };
      });
    }
    // 输入插座：同边多条输入共用一个（输入与输出永远不同位）
    for (const side of Object.keys(ic)) {
      lay.ins[side] = { frac: oc[side] ? 0.82 : 0.5 };
    }
  }
  return layout;
}

// 节点局部坐标系中的插座位置（边框外侧）
function edgePointLocal(w, h, side, frac) {
  switch (side) {
    case 'right':  return { x: w + PORT_OFF, y: h * frac };
    case 'left':   return { x: -PORT_OFF,    y: h * frac };
    case 'bottom': return { x: w * frac,     y: h + PORT_OFF };
    case 'top':    return { x: w * frac,     y: -PORT_OFF };
  }
}

// 在节点上绘制端口圆点与文字标签（坐标与连线端点完全一致）
let portLayoutCache = null;

function renderPorts() {
  canvas.querySelectorAll('.port-dot,.port-dot-label').forEach(n => n.remove());
  const layout = computePortLayout();
  portLayoutCache = layout;

  for (const [idStr, node] of Object.entries(state.nodes)) {
    const id = parseInt(idStr);
    const el = canvas.querySelector(`.node[data-id="${id}"]`);
    if (!el) continue;
    const lay = layout[id];
    if (!lay) continue;

    // 无连线的输出端口在右侧堆叠，多个时撑起节点最小高度
    const unconnected = Object.values(lay.outs).filter(o => !o.pos).length;
    if (unconnected > 1) el.style.minHeight = (30 + unconnected * 22 + 6) + 'px';
    const w = el.offsetWidth, h = el.offsetHeight;

    let stackIdx = 0;
    for (const [portId, o] of Object.entries(lay.outs)) {
      let x, y, side;
      if (o.pos) {
        // 有连线：圆点绘制在连线实际出口边（边框外侧）
        side = o.pos.side;
        const pt = edgePointLocal(w, h, side, o.pos.frac);
        x = pt.x; y = pt.y;
      } else {
        // 无连线：右侧外堆叠，作为发起连线的拖拽手柄
        side = 'right';
        y = 30 + stackIdx * 22; stackIdx++;
        x = w + PORT_OFF;
      }
      const dot = document.createElement('div');
      dot.className = 'port-dot out';
      dot.dataset.port = portId;
      dot.style.left = (x - 5) + 'px';
      dot.style.top = (y - 5) + 'px';
      dot.onmousedown = e => { e.stopPropagation(); startConnection(id, portId, e); };
      el.appendChild(dot);

      // 文字标签：左右边插座的标签贴在边框内侧，上下边插座的标签在圆点旁侧
      const lbl = document.createElement('div');
      lbl.className = 'port-dot-label';
      if (side === 'right')      { lbl.style.right = '9px';          lbl.style.top = (y - 7) + 'px'; }
      else if (side === 'left')  { lbl.style.left = '9px';           lbl.style.top = (y - 7) + 'px'; }
      else if (side === 'top')   { lbl.style.left = (x + 9) + 'px';  lbl.style.top = (y - 7) + 'px'; }
      else                       { lbl.style.left = (x + 9) + 'px';  lbl.style.top = (y - 7) + 'px'; }
      lbl.textContent = o.label;
      el.appendChild(lbl);
    }

    // 输入插座（青色）：同边多条输入共用一个，位于边框外侧，与连线入口重合
    for (const [side, inp] of Object.entries(lay.ins)) {
      const pt = edgePointLocal(w, h, side, inp.frac);
      const dot = document.createElement('div');
      dot.className = 'port-dot in';
      dot.style.left = (pt.x - 5) + 'px';
      dot.style.top = (pt.y - 5) + 'px';
      el.appendChild(dot);
    }
  }
}

// 计算两节点之间的进出边方向
function calcConnSides(fromId, toId) {
  const fb = nodeBounds(fromId);
  const tb = nodeBounds(toId);
  if (!fb || !tb) return null;
  const dx = tb.cx - fb.cx;
  const dy = tb.cy - fb.cy;
  let fromSide, toSide;
  if (Math.abs(dx) >= Math.abs(dy)) {
    fromSide = dx >= 0 ? 'right' : 'left';
  } else {
    fromSide = dy >= 0 ? 'bottom' : 'top';
  }
  toSide = oppositeSide(fromSide);
  return { fromSide, toSide };
}

const SVGNS = 'http://www.w3.org/2000/svg';

function renderConnections() {
  svg.innerHTML = '';
  svg.setAttribute('width', canvas.offsetWidth);
  svg.setAttribute('height', canvas.offsetHeight);

  if (!portLayoutCache) portLayoutCache = computePortLayout();
  const layout = portLayoutCache;

  state.connections.forEach((conn, idx) => {
    const lo = layout[conn.from] && layout[conn.from].outs[conn.port];
    if (!lo || !lo.pos) return;
    const toSide = oppositeSide(lo.pos.side);
    const li = layout[conn.to] && layout[conn.to].ins[toSide];
    if (!li) return;
    const fb = nodeBounds(conn.from);
    const tb = nodeBounds(conn.to);
    if (!fb || !tb) return;
    // 端点坐标 = 节点上圆点（插座）的坐标（同一套布局结果）
    const from = sidePoint(fb, lo.pos.side, lo.pos.frac);
    const to   = sidePoint(tb, toSide, li.frac);

    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', bezierPathDir(from.x, from.y, to.x, to.y, lo.pos.side, toSide));
    path.setAttribute('class', 'conn-path' + (state.selectedConn === idx ? ' selected' : ''));
    path.onclick = e => {
      e.stopPropagation();
      selectNode(null);          // 取消节点选中
      state.selectedConn = idx;  // 标记连线选中
      renderConnections();
    };
    svg.appendChild(path);
  });

  // 临时连线（从起点圆点出发，跟随鼠标）
  if (connDrag) {
    const dx = connDrag.x - connDrag.from.x;
    const dy = connDrag.y - connDrag.from.y;
    const toSide = Math.abs(dx) >= Math.abs(dy) ? (dx >= 0 ? 'left' : 'right') : (dy >= 0 ? 'top' : 'bottom');
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', bezierPathDir(connDrag.from.x, connDrag.from.y, connDrag.x, connDrag.y, connDrag.fromSide, toSide));
    path.setAttribute('class', 'conn-temp');
    svg.appendChild(path);
  }
}

// 带方向的贝塞尔曲线：控制点沿出口/入口边方向延伸
function bezierPathDir(x1, y1, x2, y2, fromSide, toSide) {
  const dist = Math.max(40, Math.hypot(x2 - x1, y2 - y1) * 0.4);
  const cp1 = ctrlOffset(x1, y1, fromSide, dist);
  const cp2 = ctrlOffset(x2, y2, toSide, dist);
  return `M ${x1} ${y1} C ${cp1.x} ${cp1.y}, ${cp2.x} ${cp2.y}, ${x2} ${y2}`;
}

function ctrlOffset(x, y, side, d) {
  switch (side) {
    case 'right':  return { x: x + d, y };
    case 'left':   return { x: x - d, y };
    case 'bottom': return { x, y: y + d };
    case 'top':    return { x, y: y - d };
  }
}

// ============================================================
//  拖拽节点
// ============================================================
function startDragNode(e, id) {
  e.preventDefault();
  e.stopPropagation();
  selectNode(id);
  const node = state.nodes[id];
  const rect = canvas.getBoundingClientRect();
  drag = {
    id,
    offsetX: e.clientX - rect.left - canvasWrap.scrollLeft - node.x,
    offsetY: e.clientY - rect.top - canvasWrap.scrollTop - node.y,
  };
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

function onDragMove(e) {
  if (drag) {
    const rect = canvas.getBoundingClientRect();
    state.nodes[drag.id].x = e.clientX - rect.left - canvasWrap.scrollLeft - drag.offsetX;
    state.nodes[drag.id].y = e.clientY - rect.top - canvasWrap.scrollTop - drag.offsetY;
    const el = canvas.querySelector(`.node[data-id="${drag.id}"]`);
    if (el) { el.style.left = state.nodes[drag.id].x + 'px'; el.style.top = state.nodes[drag.id].y + 'px'; }
    // 节点移动后路由方向可能改变，圆点与连线一起刷新
    renderPorts();
    renderConnections();
  }
  if (connDrag) {
    const rect = canvas.getBoundingClientRect();
    connDrag.x = e.clientX - rect.left + canvasWrap.scrollLeft;
    connDrag.y = e.clientY - rect.top + canvasWrap.scrollTop;
    renderConnections();
  }
}

function onDragEnd(e) {
  drag = null;
  if (connDrag) {
    // 落在目标节点任意位置即可建立连线
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const nodeEl = el ? el.closest('.node') : null;
    const toId = nodeEl ? parseInt(nodeEl.dataset.id) : null;
    if (toId && toId !== connDrag.fromId) {
      // 同一输出端口只保留一条连线
      state.connections = state.connections.filter(c =>
        !(c.from === connDrag.fromId && c.port === connDrag.port)
      );
      state.connections.push({ from: connDrag.fromId, port: connDrag.port, to: toId });
    }
    connDrag = null;
    document.body.classList.remove('connecting');
    renderAll();
  }
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
}

// ============================================================
//  连线
// ============================================================
function startConnection(fromId, port, e) {
  e.preventDefault();
  e.stopPropagation();
  // 起点 = 该端口圆点当前位置（与节点上绘制的圆点同步）
  const lay = computePortLayout()[fromId];
  const lo = lay ? lay.outs[port] : null;
  const b = nodeBounds(fromId);
  let from, fromSide;
  if (lo && lo.pos) {
    fromSide = lo.pos.side;
    from = sidePoint(b, lo.pos.side, lo.pos.frac);
  } else {
    // 无连线端口：与 renderPorts 的右侧外堆叠位置保持一致
    fromSide = 'right';
    let stackIdx = 0;
    for (const [pid, o] of Object.entries(lay ? lay.outs : {})) {
      if (pid === port) break;
      if (!o.pos) stackIdx++;
    }
    from = { x: b.x + b.w + PORT_OFF, y: b.y + 30 + stackIdx * 22 };
  }
  const rect = canvas.getBoundingClientRect();
  connDrag = {
    fromId, port, from, fromSide,
    x: e.clientX - rect.left + canvasWrap.scrollLeft,
    y: e.clientY - rect.top + canvasWrap.scrollTop,
  };
  document.body.classList.add('connecting');
  const dotEl = canvas.querySelector(`.node[data-id="${fromId}"] .port-dot[data-port="${port}"]`);
  if (dotEl) dotEl.classList.add('dragging');
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

// ============================================================
//  选中 / 删除
// ============================================================
function selectNode(id) {
  state.selected = id;
  state.selectedConn = null;
  renderAll();
  updatePropPanel();
}

function deleteNode(id) {
  delete state.nodes[id];
  state.connections = state.connections.filter(c => c.from !== id && c.to !== id);
  if (state.root === id) state.root = Object.keys(state.nodes)[0] ? parseInt(Object.keys(state.nodes)[0]) : null;
  if (state.rewind === id) state.rewind = null;
  if (state.selected === id) state.selected = null;
  renderAll();
  updatePropPanel();
}

function showContextMenu(e, id) {
  // 简易菜单：用prompt模拟
  const action = prompt(
    `节点 #${id} (${NODE_TYPES[state.nodes[id].type].label})\n\n` +
    `输入数字选择操作:\n1. 设为根节点\n2. 设为回退节点\n3. 删除节点`
  );
  if (action === '1') { state.root = id; renderAll(); toast('已设为根节点'); }
  else if (action === '2') { state.rewind = id; renderAll(); toast('已设为回退节点'); }
  else if (action === '3') { deleteNode(id); }
}

// ============================================================
//  属性面板
// ============================================================
function updatePropPanel() {
  const empty = $('prop-empty');
  const content = $('prop-content');
  if (state.selected === null || !state.nodes[state.selected]) {
    empty.style.display = '';
    content.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  content.style.display = '';
  const id = state.selected;
  const node = state.nodes[id];
  const def = NODE_TYPES[node.type];

  let html = `<h2><div class="dot" style="background:${def.color}"></div>${def.label} <span style="color:#666">#${id}</span></h2>`;

  // 各字段
  for (const f of def.fields) {
    html += renderField(f, node.data[f.key], id);
  }

  // SWITCH 分支管理
  if (node.type === 'SWITCH') {
    const tk = node.data._targetKeys || [];
    html += `<div class="field"><label>分支管理</label>`;
    tk.forEach((key, i) => {
      const conn = state.connections.find(c => c.from === id && c.port === `target_${i}`);
      const toStr = conn ? `→ #${conn.to}` : '未连接';
      html += `<div class="target-row">
        <span>分支${i+1}</span>
        <input type="text" value="${escapeAttr(key)}" onchange="updateTargetKey(${id},${i},this.value)">
        <span class="target-to">${toStr}</span>
        <button class="del-btn" onclick="removeTarget(${id},${i})">×</button>
      </div>`;
    });
    html += `<button class="add-btn" onclick="addTarget(${id})">+ 添加分支</button></div>`;
  }

  // 高级选项
  html += `<span class="adv-toggle" onclick="this.nextElementSibling.classList.toggle('show')">▶ 高级 (before/after 脚本)</span>`;
  html += `<div class="adv-fields">`;
  html += renderField({key:'before', label:'前置脚本(Lua)', render:'textarea'}, node.data.before || '', id);
  html += renderField({key:'after',  label:'后置脚本(Lua)', render:'textarea'}, node.data.after || '', id);
  html += `</div>`;

  // 操作按钮
  html += `<div class="btn-row">
    <button onclick="state.root=${id};renderAll()">设为根节点</button>
    <button onclick="state.rewind=${id};toast('已设为回退节点')">设为回退</button>
  </div>`;
  html += `<div class="btn-row">
    <button class="danger" onclick="deleteNode(${id})">删除节点</button>
  </div>`;

  content.innerHTML = html;
}

function renderField(f, val, nodeId) {
  const k = f.key;
  switch (f.render) {
    case 'text':
      return `<div class="field"><label>${f.label}</label>
        <input type="text" value="${escapeAttr(val||'')}" onchange="setField(${nodeId},'${k}',this.value)"></div>`;
    case 'number':
      return `<div class="field"><label>${f.label}</label>
        <input type="number" value="${val||0}" onchange="setField(${nodeId},'${k}',parseInt(this.value)||0)"></div>`;
    case 'textarea':
      return `<div class="field"><label>${f.label}</label>
        <textarea onchange="setField(${nodeId},'${k}',this.value)">${escapeHtml(val||'')}</textarea></div>`;
    case 'input': {
      // 卡片式：名称 + 取值方式 + 独立value输入框（如 SOCK 的 ip/port）
      const v = val || {};
      return `<div class="field"><label>${f.label}</label>
        <div class="kv2">
          <div class="kv2-row1">
            <span class="kv2-tag">${k}</span>
            <select onchange="setInputType(${nodeId},'${k}',this.value)" title="取值方式">${typeOpts(v.type)}</select>
          </div>
          <input class="kv-val" type="text" placeholder="取值（attr=属性名 / const=直接值 / lua=表达式 / var=变量名）" value="${escapeAttr(v.value||'')}" onchange="setInputValue(${nodeId},'${k}',this.value)">
        </div></div>`;
    }
    case 'kv':
    case 'kv-raw': {
      const obj = val || {};
      const keys = Object.keys(obj);
      const isRaw = f.render === 'kv-raw';
      let html = `<div class="field"><label>${f.label}</label>`;
      keys.forEach((key, i) => {
        const v = obj[key];
        html += `<div class="kv2">
          <div class="kv2-row1">
            <input class="kv-key" type="text" placeholder="参数名" value="${escapeAttr(key)}" onchange="renameKvKey(${nodeId},'${k}',${i},this.value)">
            ${isRaw ? '' : `<select onchange="setKvType(${nodeId},'${k}',${i},this.value)" title="取值方式">${typeOpts(v?.type)}</select>`}
            <button class="del-btn" onclick="delKvKey(${nodeId},'${k}',${i})" title="删除参数">×</button>
          </div>
          <input class="kv-val" type="text" placeholder="${isRaw ? '参数值' : '取值（attr=属性名 / var=变量名 / lua=表达式 / const=常量）'}" value="${escapeAttr(isRaw ? v : (v?.value || ''))}" onchange="${isRaw ? `setKvRawValue(${nodeId},'${k}',${i},this.value)` : `setKvValue(${nodeId},'${k}',${i},this.value)`}">
        </div>`;
      });
      if (!keys.length) html += `<div class="kv-empty">暂无参数，点击下方按钮添加</div>`;
      html += `<button class="add-btn" onclick="addKvKey(${nodeId},'${k}','${f.render}')">+ 添加参数</button></div>`;
      return html;
    }
    case 'case-select': {
      // 子用例下拉：从已加载的子用例目录中选择，排除自身（防止自递归）
      const current = val || '';
      const opts = [];
      opts.push(`<option value="" ${current ? '' : 'selected'} disabled>${subCases.length ? '请选择子用例' : '未加载子用例目录'}</option>`);
      subCases.forEach(sc => {
        if (sc.name === state.caseName) return;
        opts.push(`<option value="${escapeAttr(sc.name)}" ${sc.name === current ? 'selected' : ''}>${escapeHtml(sc.name)}（${escapeHtml(sc.path)}）</option>`);
      });
      // 当前值不在已加载列表中时保留显示（如尚未加载目录或来自导入数据）
      if (current && !subCases.some(sc => sc.name === current)) {
        opts.push(`<option value="${escapeAttr(current)}" selected>${escapeHtml(current)}（未在已加载目录中）</option>`);
      }
      return `<div class="field"><label>${f.label}</label>
        <select onchange="setField(${nodeId},'${k}',this.value)">${opts.join('')}</select></div>`;
    }
    case 'list': {
      const arr = val || [];
      let html = `<div class="field"><label>${f.label}</label>`;
      arr.forEach((item, i) => {
        html += `<div class="io-row">
          <input type="text" value="${escapeAttr(item)}" onchange="setListItem(${nodeId},'${k}',${i},this.value)">
          <button class="del-btn" onclick="delListItem(${nodeId},'${k}',${i})">×</button>
        </div>`;
      });
      html += `<button class="add-btn" onclick="addListItem(${nodeId},'${k}')">+ 添加</button></div>`;
      return html;
    }
  }
  return '';
}

function typeOpts(selected) {
  return TYPE_OPTIONS.map(t => `<option value="${t}" ${t===selected?'selected':''}>${t}</option>`).join('');
}

// 属性修改函数
function setField(id, key, val) { state.nodes[id].data[key] = val; renderAll(); }
function setInputType(id, key, type) {
  if (!state.nodes[id].data[key]) state.nodes[id].data[key] = {};
  state.nodes[id].data[key].type = type;
  renderAll();
}
function setInputValue(id, key, val) {
  if (!state.nodes[id].data[key]) state.nodes[id].data[key] = {type:'attr'};
  state.nodes[id].data[key].value = val;
  renderAll();
}
// 按索引定位参数名（避免 DOM 相邻引用与特殊字符转义问题）
function kvKeyAt(id, field, idx) {
  const obj = state.nodes[id].data[field] || {};
  return Object.keys(obj)[idx];
}
function addKvKey(id, field, renderType) {
  const obj = state.nodes[id].data[field] || {};
  let n = 1, nk = `param${n}`;
  while (obj[nk]) { n++; nk = `param${n}`; }
  obj[nk] = renderType === 'kv-raw' ? '' : {type:'attr', value:''};
  state.nodes[id].data[field] = obj;
  updatePropPanel(); renderAll();
}
function renameKvKey(id, field, idx, newName) {
  const obj = state.nodes[id].data[field]; if (!obj) return;
  const oldKey = kvKeyAt(id, field, idx);
  if (!oldKey || !newName || oldKey === newName) return;
  if (obj[newName] !== undefined) { toast('参数名已存在'); updatePropPanel(); return; }
  obj[newName] = obj[oldKey]; delete obj[oldKey];
  updatePropPanel(); renderAll();
}
function setKvType(id, field, idx, type) {
  const key = kvKeyAt(id, field, idx); if (!key) return;
  const item = state.nodes[id].data[field][key];
  if (item && typeof item === 'object') { item.type = type; renderAll(); }
}
function setKvValue(id, field, idx, val) {
  const key = kvKeyAt(id, field, idx); if (!key) return;
  const item = state.nodes[id].data[field][key];
  if (item && typeof item === 'object') { item.value = val; renderAll(); }
}
function setKvRawValue(id, field, idx, val) {
  const key = kvKeyAt(id, field, idx); if (!key) return;
  state.nodes[id].data[field][key] = val;
  renderAll();
}
function delKvKey(id, field, idx) {
  const key = kvKeyAt(id, field, idx); if (!key) return;
  delete state.nodes[id].data[field][key];
  updatePropPanel(); renderAll();
}
function addListItem(id, key) {
  (state.nodes[id].data[key] = state.nodes[id].data[key] || []).push("");
  updatePropPanel(); renderAll();
}
function setListItem(id, key, i, val) {
  state.nodes[id].data[key][i] = val;
  renderAll();
}
function delListItem(id, key, i) {
  state.nodes[id].data[key].splice(i, 1);
  updatePropPanel(); renderAll();
}
function addTarget(id) {
  (state.nodes[id].data._targetKeys = state.nodes[id].data._targetKeys || []).push(String((state.nodes[id].data._targetKeys.length||0)+1));
  updatePropPanel(); renderAll();
}
function removeTarget(id, i) {
  state.nodes[id].data._targetKeys.splice(i, 1);
  // 移除对应连线，并重新映射target_N
  state.connections = state.connections.filter(c => !(c.from === id && c.port === `target_${i}`));
  // 重映射后续端口名
  state.connections.forEach(c => {
    if (c.from === id && c.port.startsWith('target_')) {
      const idx = parseInt(c.port.split('_')[1]);
      if (idx > i) c.port = `target_${idx - 1}`;
    }
  });
  updatePropPanel(); renderAll();
}
function updateTargetKey(id, i, val) {
  state.nodes[id].data._targetKeys[i] = val;
  renderAll();
}

// ============================================================
//  导入/导出
// ============================================================
function buildExportData() {
  const result = { name: state.caseName || "untitled", root: state.root };
  if (state.rewind != null) result.rewind = state.rewind;
  const nodes = {};
  for (const [idStr, node] of Object.entries(state.nodes)) {
    const id = parseInt(idStr);
    const n = { type: node.type };
    // 复制data中的字段
    for (const [k, v] of Object.entries(node.data)) {
      if (k === '_targetKeys') continue;
      // 深拷贝
      n[k] = JSON.parse(JSON.stringify(v));
    }
    // 设置连接
    const conns = state.connections.filter(c => c.from === id);
    let hasResult = false;
    for (const c of conns) {
      if (c.port === 'next') n.next = c.to;
      else if (c.port === 'success') { n.result = n.result || {}; n.result.success = c.to; hasResult = true; }
      else if (c.port === 'failed') { n.result = n.result || {}; n.result.failed = c.to; hasResult = true; }
      else if (c.port.startsWith('target_')) {
        const idx = parseInt(c.port.split('_')[1]);
        const key = node.data._targetKeys?.[idx] || String(idx + 1);
        n.targets = n.targets || [];
        n.targets.push([key, c.to]);
      }
    }
    nodes[id] = n;
  }
  result.nodes = nodes;
  return result;
}

let exportExt = 'json';

function exportModal(fmt) {
  const data = buildExportData();
  exportExt = fmt;
  const text = fmt === 'json' ? JSON.stringify(data, null, 2) : ('return ' + jsonToLua(data));
  showModal(`导出 ${fmt.toUpperCase()}`, text);
}

function safeFileName() {
  return (state.caseName || 'untitled').replace(/[\\/:*?"<>|]/g, '_');
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// 保存文本：已有工作目录时静默写入（不弹对话框）；否则弹系统保存对话框；再不行直接下载
async function saveTextToFolder(suggestedName, text, mime) {
  // 已有工作目录：直接写入
  if (await ensureWorkDirWritable()) {
    try {
      const fh = await workDirHandle.getFileHandle(suggestedName, { create: true });
      const w = await fh.createWritable();
      await w.write(text);
      await w.close();
      toast(`已保存 ${suggestedName} 到工作目录`);
      return;
    } catch (e) { /* 写入异常 → 走弹窗流程 */ }
  }

  if (window.showSaveFilePicker) {
    try {
      const ext = '.' + suggestedName.split('.').pop();
      const desc = ext === '.json' ? 'JSON 文件' : (ext === '.lua' ? 'Lua 文件' : '文件');
      const handle = await window.showSaveFilePicker({
        suggestedName,
        types: [{ description: desc, accept: { [mime]: [ext] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      toast(`已保存 ${handle.name}`);
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return; // 用户取消
      // 其他异常（权限/环境不支持）回退为直接下载
    }
  }
  downloadText(suggestedName, text);
  toast(`已下载 ${suggestedName}`);
}

// 用用例名保存导出文件（可选择文件夹）
function downloadExport() {
  const name = safeFileName();
  const mime = exportExt === 'json' ? 'application/json' : 'text/plain';
  saveTextToFolder(`${name}.${exportExt}`, $('modal-text').value, mime);
}

// ============================================================
//  编辑器存档：保存/加载节点位置与内容，可再次编辑
// ============================================================
function buildEditorData() {
  return {
    editor: "quanta-robot-node-editor",
    version: 1,
    name: state.caseName || "untitled",
    root: state.root,
    rewind: state.rewind,
    nextId: state.nextId,
    nodes: Object.fromEntries(Object.entries(state.nodes).map(([id, n]) => [id, {
      type: n.type,
      x: Math.round(n.x),
      y: Math.round(n.y),
      data: JSON.parse(JSON.stringify(n.data)),
    }])),
    connections: state.connections.map(c => ({ from: c.from, port: c.port, to: c.to })),
  };
}

// 保存存档：已有工作目录时静默写入（不弹对话框），无则选目录并设为工作路径
async function saveEditorFile() {
  const name = safeFileName();
  const fname = `${name}.edit.json`;
  const text = JSON.stringify(buildEditorData(), null, 2);

  // 已有工作目录：直接写入
  if (await ensureWorkDirWritable()) {
    try {
      const fh = await workDirHandle.getFileHandle(fname, { create: true });
      const w = await fh.createWritable();
      await w.write(text);
      await w.close();
      upsertSubCase(name, fname, fh);
      toast(`已保存 ${fname} 到工作目录`);
      return;
    } catch (e) { /* 写入异常 → 走选目录流程 */ }
  }

  // 无工作目录：选择目录并设为工作路径
  if (window.showDirectoryPicker) {
    let dir = null;
    try {
      dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    if (dir) {
      workDirHandle = dir;
      try {
        const fh = await dir.getFileHandle(fname, { create: true });
        const w = await fh.createWritable();
        await w.write(text);
        await w.close();
        subCases = [];
        await scanSubCaseDir(dir, '');
        updatePropPanel();
        toast(`已保存 ${fname}，工作目录已设置`);
      } catch (e) {
        alert('保存失败: ' + e.message);
      }
      return;
    }
  }

  // 浏览器不支持 → 回退为普通保存对话框
  saveTextToFolder(fname, text, 'application/json');
}

function applyEditorData(data) {
  if (!data || !data.nodes) throw new Error('不是有效的编辑器存档文件');
  state.caseName = data.name || 'untitled';
  $('case-name').value = state.caseName;
  state.root = data.root ?? null;
  state.rewind = data.rewind ?? null;
  state.nextId = data.nextId || 1;
  state.nodes = {};
  state.connections = [];
  state.selected = null;
  state.selectedConn = null;
  for (const [id, n] of Object.entries(data.nodes)) {
    if (!NODE_TYPES[n.type]) throw new Error(`未知节点类型: ${n.type}`);
    state.nodes[parseInt(id)] = {
      type: n.type,
      x: n.x || 0,
      y: n.y || 0,
      data: JSON.parse(JSON.stringify(n.data || {})),
    };
  }
  state.connections = (data.connections || []).map(c => ({ from: c.from, port: c.port, to: c.to }));
  if (state.root == null || !state.nodes[state.root]) {
    state.root = Object.keys(state.nodes).length ? parseInt(Object.keys(state.nodes)[0]) : null;
  }
  renderAll();
  updatePropPanel();
}

// 应用导出格式的用例数据（示例加载等内部使用）
function applyCaseData(data) {
  state.caseName = data.name || "untitled";
  $('case-name').value = state.caseName;
  state.root = data.root;
  state.rewind = data.rewind || data.root;
  state.nodes = {};
  state.connections = [];
  state.nextId = 1;

  for (const [idStr, conf] of Object.entries(data.nodes)) {
    const id = parseInt(idStr);
    if (id >= state.nextId) state.nextId = id + 1;
    const type = conf.type;
    const nodeData = {};
    const def = NODE_TYPES[type];
    for (const f of def.fields) {
      if (conf[f.key] !== undefined) nodeData[f.key] = JSON.parse(JSON.stringify(conf[f.key]));
    }
    if (type === 'SWITCH') {
      nodeData._targetKeys = (conf.targets || []).map(t => t[0]);
    }
    // 自动布局
    const count = Object.keys(state.nodes).length;
    const x = 80 + (count % 5) * 210;
    const y = 60 + Math.floor(count / 5) * 160;
    state.nodes[id] = {type, x, y, data: nodeData};

    // 解析连接
    if (conf.next != null) state.connections.push({from: id, port: 'next', to: conf.next});
    if (conf.result) {
      if (conf.result.success != null) state.connections.push({from: id, port: 'success', to: conf.result.success});
      if (conf.result.failed != null) state.connections.push({from: id, port: 'failed', to: conf.result.failed});
    }
    if (conf.targets) {
      conf.targets.forEach((t, i) => {
        state.connections.push({from: id, port: `target_${i}`, to: t[1]});
      });
    }
  }
  state.selected = null;
  renderAll();
  updatePropPanel();
}

// ============================================================
//  工作目录：用例存档的默认保存位置，也是子用例列表的来源
// ============================================================
let workDirHandle = null;   // 工作目录句柄（仅存内存，刷新页面后需重新选择）
let subCases = [];          // {name, path, handle}

// 确保工作目录有读写权限（浏览器可能在会话恢复后回收权限）
async function ensureWorkDirWritable() {
  if (!workDirHandle || workDirHandle.kind !== 'directory') return false;
  if (await workDirHandle.queryPermission({ mode: 'readwrite' }) === 'granted') return true;
  return await workDirHandle.requestPermission({ mode: 'readwrite' }) === 'granted';
}

// 设置工作目录；已有工作目录时只刷新其下的用例列表，不再弹选择框
async function pickWorkDir() {
  if (!window.showDirectoryPicker) {
    alert('当前浏览器不支持目录选择，请使用 Edge 或 Chrome');
    return;
  }
  // 已有工作目录：恢复权限后直接刷新扫描
  if (workDirHandle && workDirHandle.kind === 'directory') {
    if (await ensureWorkDirWritable()) {
      await refreshSubCases();
      return;
    }
    // 权限无法恢复 → 继续走重新选择
  }
  try {
    workDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    alert('打开目录失败: ' + e.message);
    return;
  }
  await refreshSubCases();
  updateWorkDirLabel();
}

// 工具栏显示当前工作目录名
function updateWorkDirLabel() {
  const el = $('workdir-label');
  if (el) el.textContent = workDirHandle ? `当前: ${workDirHandle.name}` : '未设置';
}

async function refreshSubCases() {
  if (!workDirHandle) return;
  subCases = [];
  try {
    await scanSubCaseDir(workDirHandle, '');
  } catch (e) {
    alert('扫描目录失败: ' + e.message);
  }
  toast(`工作目录「${workDirHandle.name}」找到 ${subCases.length} 个用例`);
  updatePropPanel();
  updateWorkDirLabel();
}

async function scanSubCaseDir(dirHandle, prefix) {
  for await (const [name, handle] of dirHandle.entries()) {
    if (handle.kind === 'directory') {
      await scanSubCaseDir(handle, prefix + name + '/');
    } else if (name.endsWith('.edit.json')) {
      // 优先使用存档内的用例名，其次文件名；同名去重
      let caseName = name.replace(/\.edit\.json$/, '');
      try {
        const data = JSON.parse(await (await handle.getFile()).text());
        if (data.name) caseName = data.name;
      } catch (err) { /* 文件损坏时退回文件名 */ }
      if (!subCases.some(sc => sc.name === caseName)) {
        subCases.push({ name: caseName, path: prefix + name, handle });
      }
    }
  }
}

// 打开：无工作目录时先选目录（其路径即为工作路径），再从目录存档列表中点选打开
async function openCaseFile() {
  if (!workDirHandle) {
    await pickWorkDir();
    if (!workDirHandle) return; // 用户取消
  }
  if (!subCases.length) await refreshSubCases();
  if (!subCases.length) { toast('工作目录下没有 edit.json 存档'); return; }
  if (subCases.length === 1) { await openSubCase(subCases[0]); return; }
  showSubCasePicker();
}

async function openSubCase(sc) {
  try {
    const data = JSON.parse(await (await sc.handle.getFile()).text());
    if (Array.isArray(data.connections)) {
      applyEditorData(data);   // 编辑器存档（含节点位置）
    } else if (data.nodes) {
      applyCaseData(data);     // 导出格式（自动布局）
    } else {
      throw new Error('无法识别的文件格式');
    }
    closeModal();
    toast(`已打开 ${sc.name}`);
  } catch (e) {
    alert('打开失败: ' + e.message);
  }
}

// 用例选择列表（工作目录下有多个存档时弹出）
function showSubCasePicker() {
  const items = subCases.map((sc, i) =>
    `<div class="case-item" onclick="pickSubCase(${i})">
       <span class="case-name">${escapeHtml(sc.name)}</span>
       <span class="case-path">${escapeHtml(sc.path)}</span>
     </div>`).join('');
  $('modal-container').innerHTML = `<div class="modal-bg" id="modal-bg">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><h3>打开用例（${subCases.length}）</h3><button class="close" onclick="closeModal()">×</button></div>
      <div class="modal-body"><div class="case-list">${items}</div></div>
    </div>
  </div>`;
  $('modal-bg').onclick = closeModal;
}

function pickSubCase(i) { openSubCase(subCases[i]); }

// 保存后把存档加入/更新到用例列表（CASE 节点下拉框立即可选）
function upsertSubCase(name, path, handle) {
  const i = subCases.findIndex(sc => sc.name === name);
  const entry = { name, path, handle };
  if (i >= 0) subCases[i] = entry; else subCases.push(entry);
  updatePropPanel();
}

// JSON转Lua表
function jsonToLua(obj, indent) {
  indent = indent || 0;
  const pad = '    '.repeat(indent);
  const pad2 = '    '.repeat(indent + 1);
  if (Array.isArray(obj)) {
    if (obj.length === 0) return '{}';
    const lines = obj.map(v => pad2 + jsonToLua(v, indent + 1) + ',');
    return '{\n' + lines.join('\n') + '\n' + pad + '}';
  }
  if (typeof obj === 'object' && obj !== null) {
    const keys = Object.keys(obj);
    if (keys.length === 0) return '{}';
    const lines = keys.map(k => {
      const key = /^\d+$/.test(k) ? `[${k}]` : k;
      return pad2 + key + ' = ' + jsonToLua(obj[k], indent + 1) + ',';
    });
    return '{\n' + lines.join('\n') + '\n' + pad + '}';
  }
  if (typeof obj === 'string') {
    if (obj.includes('\n')) return '[[' + obj + ']]';
    return '"' + obj.replace(/\\/g,'\\\\').replace(/"/g,'\\"') + '"';
  }
  if (typeof obj === 'boolean') return obj ? 'true' : 'false';
  if (obj === null || obj === undefined) return 'nil';
  return String(obj);
}

// ============================================================
//  模态框
// ============================================================
function showModal(title, text) {
  const c = $('modal-container');
  c.innerHTML = `<div class="modal-bg" id="modal-bg">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <textarea id="modal-text">${escapeHtml(text)}</textarea>
      </div>
      <div class="modal-foot">
        <button class="primary" onclick="downloadExport()">保存文件</button>
        <button class="secondary" onclick="closeModal()">关闭</button>
      </div>
    </div>
  </div>`;
  $('modal-bg').onclick = closeModal;
}

function closeModal() { $('modal-container').innerHTML = ''; }

// ============================================================
//  辅助
// ============================================================
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

function clearAll() {
  if (!confirm('确定清空所有节点？')) return;
  state.nodes = {}; state.connections = []; state.root = null; state.rewind = null; state.selected = null; state.nextId = 1;
  renderAll(); updatePropPanel();
}
