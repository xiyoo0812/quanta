  sel.innerHTML = groups.map(g => `<option value="${escapeAttr(g)}" ${g === state.caseGroup ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('');
}

// 分组下拉与 state 同步（打开用例后调用，让主页下拉跟随用例的分组）
function syncCaseGroupSelect() {
  const sel = $('case-group');
  if (sel && sel.value !== state.caseGroup) renderGroupOptions();
}

// 切换分组：仅影响当前编辑上下文，随下次保存写进存档
function setCaseGroup(val) {
  state.caseGroup = val || 'default';
}

// 新增分组：模态对话框输入名字，成功后选中该分组
function addGroup() {

function confirmAddGroup() {

// 保存：POST /cases?name=名字，body 为用例 json 字符串；名字重复时需确认覆盖；无节点不保存
async function saveEditorFile() {
  if (!Object.keys(state.nodes).length) { toast('画布为空，无需保存'); return; }
  const name = (state.caseName || 'case1').trim();
  if (!name) { uiAlert('用例名称不能为空'); return; }
  const exists = subCases.some(sc => sc.name === name);
  if (exists) {
    uiConfirm(`用例「${name}」已存在，确定覆盖保存？`, () => doSaveEditorFile(name, true), '覆盖确认', '覆盖保存');
    return;
  }
  doSaveEditorFile(name, false);
}

// 覆盖确认后执行保存
async function doSaveEditorFile(name, exists) {
  const body = JSON.stringify(buildEditorData(), null, 2);   // 格式化缩进，便于服务端文件直接阅读
  try {
    const res = await fetch(accordApi(`/cases?name=${encodeURIComponent(name)}`), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body,
    });
    const r = await res.json();
    if (r.code !== 0) { uiAlert('保存失败: ' + (r.msg || '未知错误')); return; }
    // 保存成功后同步本地缓存（否则下次保存 exists 判断不到，不会弹覆盖确认）
    const i = subCases.findIndex(sc => sc.name === name);
    const entry = { name, content: body, exec: { params: JSON.parse(JSON.stringify(execOpts.params || [])), interval: execOpts.interval, debug: execOpts.debug }, group: state.caseGroup || 'default' };
    if (i >= 0) subCases[i] = entry; else subCases.push(entry);
    renderGroupOptions();
    toast(`已保存 ${name}${exists ? '（覆盖）' : ''}`);
    updatePropPanel();
    closeModal();
  } catch (e) {
    uiAlert('保存失败: ' + e.message);
  }
}

// 二次确认框（覆盖层样式，叠加在当前弹窗之上，不破坏底层对话框）：uiConfirm(msg, onOk[, title, okText])
function uiConfirm(msg, onOk, title = '确认', okText = '确定') {
  // 移除旧的确认层
  document.getElementById('ui-confirm-layer')?.remove();
  const layer = document.createElement('div');
  layer.id = 'ui-confirm-layer';
  layer.className = 'modal-bg';
  layer.style.zIndex = 1500;   // 高于普通弹窗(1000)
  layer.innerHTML = `<div class="modal" style="width:420px" onclick="event.stopPropagation()">
      <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="close" onclick="this.closest('#ui-confirm-layer').remove()">×</button></div>
      <div class="modal-body" style="color:#ccc;font-size:13px;line-height:1.8">${escapeHtml(msg)}</div>
      <div class="modal-foot">
        <button class="primary">${escapeHtml(okText)}</button>
        <button class="secondary" onclick="this.closest('#ui-confirm-layer').remove()">取消</button>
      </div>
    </div>`;
  layer.querySelector('.primary').onclick = () => { layer.remove(); if (onOk) onOk(); };
  // 点遮罩不关闭确认框（只能通过按钮关闭）
  layer.onclick = null;
  document.body.appendChild(layer);
}

// 删除用例：closeAfter=删除成功后关闭调试面板；nameOverride=指定用例名（打开对话框逐条删除用）
async function deleteCase(closeAfter, nameOverride) {
  const name = (nameOverride || state.caseName || 'case1').trim();
  if (!name) { uiAlert('用例名称不能为空'); return; }
  if (!subCases.some(sc => sc.name === name)) { uiAlert(`用例「${name}」在服务器上不存在`); return; }
  uiConfirm(`确定删除服务器上的用例「${name}」？此操作不可恢复。`, () => doDeleteCase(closeAfter, name), '删除确认', '删除');
}

// 二次确认后执行删除
async function doDeleteCase(closeAfter, name) {
  try {
    const res = await fetch(accordApi(`/cases?name=${encodeURIComponent(name)}`), { method: 'DELETE' });
    const r = await res.json();
    if (r.code !== 0) { uiAlert('删除失败: ' + (r.msg || '未知错误')); return; }
    subCases = subCases.filter(sc => sc.name !== name);
    toast(`已删除 ${name}`);
    renderGroupOptions();   // 删除后分组列表可能变化
    // 顶栏删除的是当前打开的用例：清空画布
    if (closeAfter) {
      state.nodes = {}; state.connections = []; state.root = null;
      state.selected = null; state.selectedConn = null; state.nextId = 1;
      renderAll();
    }
    updatePropPanel();
    // 刷新打开对话框（若开着），保持分组过滤视图最新
    const pickerOpen = $('modal-bg') && document.querySelector('.picker-group-row');
    if (pickerOpen) renderSubCasePicker();
  } catch (e) {
    uiAlert('删除失败: ' + e.message);
  }
}

// 打开：先刷新服务器用例列表，再弹出选择（单个直接打开）
async function openCaseFile() {
  await refreshCases();
  if (!subCases.length) { toast('服务器上没有用例'); return; }
  if (subCases.length === 1) { await openSubCase(subCases[0]); return; }
  showSubCasePicker();
}

// 刷新：重拉 /cases 和 /protos，更新用例缓存、协议缓存与画布/面板显示
// （不影响当前画布上正在编辑的内容，只更新下拉列表/协议解析等引用数据）
async function refreshAll() {
  const okC = await refreshCases();
  const okP = await refreshProtos();
  renderMsgList(); showMsgDetail();   // 协议变化后消息列表同步补全
  renderAll(); updatePropPanel();
  toast(okC || okP ? '刷新完成' : '刷新失败：服务器无响应');
}

// 用例选择列表（按分组过滤展示，每个用例带删除按钮）
let casePickerGroup = '';   // 打开对话框当前选中的分组（空 = 全部分组）

function showSubCasePicker() {
  const groups = collectGroups();
  if (casePickerGroup && !groups.includes(casePickerGroup)) casePickerGroup = '';
  renderSubCasePicker();
}

function setPickerGroup(g) {
  casePickerGroup = g || '';
  renderSubCasePicker();
}

function renderSubCasePicker() {
  const groups = collectGroups();
  // 顶部插入「全部分组」选项；空值 = 显示所有用例
  const opts = [`<option value="" ${!casePickerGroup ? 'selected' : ''}>全部分组</option>`]
    .concat(groups.map(g => `<option value="${escapeAttr(g)}" ${g === casePickerGroup ? 'selected' : ''}>${escapeHtml(g)}</option>`));
  const visible = casePickerGroup
    ? subCases.map((sc, i) => ({ sc, i })).filter(({ sc }) => (sc.group || 'default') === casePickerGroup)
    : subCases.map((sc, i) => ({ sc, i }));
  const items = visible.map(({ sc, i }) =>
    `<div class="case-item" onclick="pickSubCase(${i})">
       <span class="case-name">${escapeHtml(sc.name)}<span class="case-group-tag">${escapeHtml(sc.group || 'default')}</span></span>
       <button class="del-btn" title="删除该用例" onclick="event.stopPropagation();deleteCase(null,'${escapeAttr(sc.name)}')">×</button>
     </div>`).join('');
  showModalFrame({
    title: `打开用例（${visible.length}）`,
    body: `<div class="picker-group-row">
             <label>分组</label>
             <select onchange="setPickerGroup(this.value)">${opts.join('')}</select>
           </div>
           <div class="case-list">${items || '<div class="kv-empty">该分组下暂无用例</div>'}</div>`,
  });
}

function pickSubCase(i) { openSubCase(subCases[i]); }

// 从服务器用例列表打开（供 CASE 节点下拉与后续打开功能使用的数据已缓存在 subCases）
async function openSubCase(sc) {
  try {
    const content = typeof sc.content === 'string' ? sc.content : JSON.stringify(sc.content);
    const data = JSON.parse(content);
    if (data.editor === 'quanta-robot-node-editor') {
      applyEditorData(data);   // v2 编辑器存档（运行时格式 + nodeedits）
    } else if (data.nodes) {
      applyCaseData(data);     // 纯运行时/导出格式（自动布局）
    } else {
      throw new Error('无法识别的用例格式');
    }
    syncCaseGroupSelect();   // 主页分组下拉跟随用例的分组
    closeModal();
    toast(`已打开 ${sc.name}`);
  } catch (e) {
    uiAlert('打开失败: ' + e.message);
  }
}

// ============================================================
//  协议定义：启动时从服务器 /protos 拉取，供 REQ/NTF 节点筛选选择
// ============================================================
let protoDefs = {};        // { 协议名: {msg_id, type, name, fields:{字段:类型}} }
let protoByMsgId = {};     // { msg_id: 协议定义 }（消息列表按 cmd_id 反查协议名/类型）

// 解析协议数据（格式与 proto.json 一致）
function loadProtoData(obj) {
  protoDefs = {};
  protoByMsgId = {};
  for (const [key, item] of Object.entries(obj || {})) {
    if (!item || typeof item !== 'object') continue;
    protoDefs[key] = {
      msg_id: item.msg_id || 0,
      type: item.type || '',
      name: item.name || key,
      fields: (item.fields && typeof item.fields === 'object') ? item.fields : {},
    };
    if (item.msg_id) protoByMsgId[item.msg_id] = protoDefs[key];
  }
}

// 选中协议：记录名称；REQ 依据协议 fields 自动生成输入参数
function applyProtoSelection(nodeId, key, name, nodeType, fromProto) {
  const node = state.nodes[nodeId];
  if (!node) return;
  node.data[key] = name;
  if (nodeType === 'REQ' && fromProto) {
    const p = protoDefs[name];
    const inputs = {};
    for (const fname of Object.keys((p && p.fields) || {})) {
      inputs[fname] = { type: 'attr', value: '' };
    }
    node.data.inputs = inputs;
  }
  renderNodes();
  updatePropPanel();
}

function pickProto(nodeId, key, name) {
  const nodeType = state.nodes[nodeId] ? state.nodes[nodeId].type : '';
  applyProtoSelection(nodeId, key, name, nodeType, true);
}

// 协议下拉：展开与输入筛选
function protoComboShow(input) {
  const list = input.parentElement.querySelector('.combo-list');
  if (list) list.style.display = '';
}

function protoComboFilter(input) {
  const list = input.parentElement.querySelector('.combo-list');
  if (!list) return;
  list.style.display = '';
  const kw = input.value.trim().toLowerCase();
  list.querySelectorAll('.combo-item').forEach(item => {
    const v = (item.dataset.v || '').toLowerCase();
    item.style.display = (!kw || v.includes(kw)) ? '' : 'none';
  });
}

// 失焦：收起列表；与协议名精确匹配（忽略大小写）时按选择处理，否则按自由文本保存
// 面板重建（如已选中其他协议）后，旧渲染的失焦回调作废，避免旧值把新选择重置回去
function protoComboBlur(input, nodeId, key, gen) {
  setTimeout(() => {
    if (gen !== undefined && gen !== propPanelGen) return;
    const list = input.parentElement && input.parentElement.querySelector('.combo-list');
    if (list) list.style.display = 'none';
    const v = input.value.trim();
    if (!v) return;
    const node = state.nodes[nodeId];
    if (!node) return;
    const nodeType = node.type;
    const wantType = nodeType === 'NTF' ? 'ntf' : 'req';
    const lv = v.toLowerCase();
    let p = null;
    for (const cand of Object.values(protoDefs)) {
      if (cand.type === wantType && cand.name.toLowerCase() === lv) { p = cand; break; }
    }
    if (node.data[key] === (p ? p.name : v)) return;
    applyProtoSelection(nodeId, key, p ? p.name : v, nodeType, !!p);
  }, 200);
}

function closeModal() {
  $('modal-container').innerHTML = '';
  document.removeEventListener('keydown', escCloseModal);   // ESC 监听随弹窗关闭移除
  delete window.closeModalAndCleanup;
}

// ============================================================
//  弹窗骨架复用：所有弹窗共用 modal-bg > modal > head/body/foot 结构
//  showModalFrame({ title, body, foot, width, modalClass, onClose })
//  body/foot 为已渲染好的 HTML 片段；foot 缺省为「取消」按钮
//  返回 true 表示 modal-container 已接管；onClose 在关闭时回调（如还原快照）
// ============================================================
function showModalFrame({ title, body, foot, width, modalClass = '', onClose }) {
  const closeCall = onClose ? 'closeModalAndCleanup()' : 'closeModal()';
  $('modal-container').innerHTML = `<div class="modal-bg" id="modal-bg">
    <div class="modal ${modalClass}" ${width ? `style="width:${width}"` : ''} onclick="event.stopPropagation()">
      <div class="modal-head"><h3>${title}</h3><button class="close" onclick="${closeCall}" title="关闭${onClose ? '（还原未保存修改）' : ''}">×</button></div>
      <div class="modal-body">${body}</div>
      ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
    </div>
  </div>`;
  // 点遮罩不关闭对话框（只能通过 × 或按钮关闭）；onClose 回调挂到全局供 × 按钮触发
  if (onClose) window.closeModalAndCleanup = () => { closeModal(); onClose(); };
  // ESC 关闭对话框（路径与 × 相同，含快照还原）
  document.addEventListener('keydown', escCloseModal);
}

// ESC 关闭当前弹窗：确认层优先，其次骨架弹窗（走 × 的同路径，含快照还原）
function escCloseModal(e) {
  if (e.key !== 'Escape') return;
  const layer = document.getElementById('ui-confirm-layer');
  if (layer) { layer.remove(); return; }
  if (!$('modal-container').innerHTML) return;
  const cleanup = window.closeModalAndCleanup;
  if (cleanup) {
    cleanup();                       // 含 closeModal + onClose（如还原字段编辑快照）
  } else {
    closeModal();
  }
  document.removeEventListener('keydown', escCloseModal);
  delete window.closeModalAndCleanup;
}

// ============================================================
//  日志面板：画布下方，可拖拽调高、开关、输出执行信息
// ============================================================
function appendLog(msg, autoShow = true, cls = '') {
  const panel = $('log-panel');
  if (autoShow && !panel.classList.contains('show')) panel.classList.add('show');  // 有日志时自动展开
  const box = $('log-body');
  const time = new Date().toTimeString().substring(0, 8);
  const line = document.createElement('div');
  line.className = 'log-line' + (cls ? ' ' + cls : '');
  line.textContent = `[${time}] ${msg}`;
  box.appendChild(line);
  while (box.childElementCount > 500) box.removeChild(box.firstChild);   // 限制历史行数
  box.scrollTop = box.scrollHeight;
}

function toggleLogPanel() {
  closeMsgFilterDD();
  $('log-panel').classList.toggle('show');
}

function clearLog() {
  $('log-body').textContent = '';
}

// 日志/消息/远程日志 Tab 切换
let activeLogTab = 'log';
function switchLogTab(tab) {
  closeMsgFilterDD();
  activeLogTab = tab;
  $('log-body').style.display = tab === 'log' ? '' : 'none';
  $('tab-msg').style.display = tab === 'msg' ? 'flex' : 'none';
  // tab-rlog 是平铺日志行容器：必须用 block，flex 会让每行日志变成竖排窄条
  $('tab-rlog').style.display = tab === 'rlog' ? 'block' : 'none';
  $('tab-btn-log').classList.toggle('active', tab === 'log');
  $('tab-btn-msg').classList.toggle('active', tab === 'msg');
  $('tab-btn-rlog').classList.toggle('active', tab === 'rlog');
  if (tab === 'msg') renderMsgFilter();
}

// 清空：日志/消息/远程日志三个模块一起清
function clearActiveTab() {
  clearLog();
  msgList = [];
  selectedMsgIdx = -1;
  renderMsgList();
  showMsgDetail();
  clearRemoteLog();
}

// ============================================================
//  消息 Tab：收发消息列表（左）与内容详情（右），按类型着色
// ============================================================
let msgList = [];          // {id, content, time}（协议名/类型渲染时动态反查）
let selectedMsgIdx = -1;
let msgProtoHinted = false;   // 协议未载入的提示只输出一次
let msgProtoFilter = new Set();   // 勾选的协议名集合（空 = 显示全部），仅存内存

// 按协议过滤后的可见消息（保留原始索引供选中；协议名渲染时动态反查）
function getVisibleMsgs() {
  const items = msgList.map((m, i) => ({ m, i, meta: msgMeta(m) }));
  return msgProtoFilter.size ? items.filter(x => msgProtoFilter.has(x.meta.name)) : items;
}

// 消息协议信息：渲染时按 cmd_id 动态反查协议名与类型（req/res/ntf），
// 协议文件后载入时，已收到的消息也能立即补全名字与颜色
function msgMeta(m) {
  const p = protoByMsgId[m.id];
  return { name: p ? p.name : String(m.id), type: (p && p.type) || 'ntf' };
}

function renderMsgList() {
  const box = $('msg-list');
  const items = getVisibleMsgs();
  box.innerHTML = items.length
    ? items.map(({ m, i, meta }) =>
        `<div class="msg-item msg-${meta.type}${i === selectedMsgIdx ? ' selected' : ''}" onclick="selectMsg(${i})">
           <span class="msg-name">${escapeHtml(meta.name)}</span><span class="msg-id">${m.id}</span>
         </div>`).join('')
    : `<div class="combo-empty">${msgList.length ? '当前筛选下无消息' : '暂无消息'}</div>`;
  updateMfCount();
}

function updateMfCount() {
  const el = $('mf-count');
  if (el) el.textContent = msgProtoFilter.size ? `已选 ${msgProtoFilter.size}` : '';
}

// 协议过滤：聚焦/输入时在输入框旁展开下拉（挂 body 层，按输入框位置动态定位）
function msgFilterOpen() {
  renderMsgFilter();
  const dd = $('msg-filter-dd');
  const rect = $('mf-input').getBoundingClientRect();
  dd.style.left = rect.left + 'px';
  dd.style.width = Math.max(rect.width, 280) + 'px';
  // 默认向上展开；上方空间不足时改为向下
  if (rect.top > 260) {
    dd.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
    dd.style.top = 'auto';
  } else {
    dd.style.top = rect.bottom + 4 + 'px';
    dd.style.bottom = 'auto';
  }
  dd.classList.add('open');
}

function closeMsgFilterDD() {
  const dd = $('msg-filter-dd');
  if (dd) dd.classList.remove('open');
}

function renderMsgFilter() {
  const box = $('msg-filter-list');
  const kw = ($('mf-input').value || '').trim().toLowerCase();
  const protos = Object.values(protoDefs).sort((a, b) => (a.msg_id || 0) - (b.msg_id || 0));
  const matched = protos.filter(p => !kw || p.name.toLowerCase().includes(kw));
  box.innerHTML = !protos.length
    ? `<div class="combo-empty">未载入协议</div>`
    : (matched.length
        ? matched.map(p =>
            `<label class="mf-item" data-name="${escapeAttr(p.name)}">
               <input type="checkbox" ${msgProtoFilter.has(p.name) ? 'checked' : ''} onchange="toggleMsgProtoFilter('${escapeAttr(p.name)}', this.checked)">
               <span>${escapeHtml(p.name)}</span><span class="mf-id">${p.msg_id || ''}</span>
             </label>`).join('')
        : `<div class="combo-empty">无匹配协议</div>`);
}

function toggleMsgProtoFilter(name, checked) {
  if (checked) msgProtoFilter.add(name); else msgProtoFilter.delete(name);
  updateMfCount();
  renderMsgList();
}

// 点击下拉与输入框之外时收起协议过滤
document.addEventListener('click', e => {
  const dd = $('msg-filter-dd');
  if (!dd || !dd.classList.contains('open')) return;
  const t = e.target;
  if (!dd.contains(t) && !(t.closest && t.closest('#msg-filter-combo'))) closeMsgFilterDD();
});

// 批量追加消息（执行轮询增量显示）；超过上限时丢弃最旧的
const MSG_CAP = 1000;
function appendMsgs(items) {
  if (!items || !items.length) return;
  for (const it of items) msgList.push(it);
  if (msgList.length > MSG_CAP) msgList = msgList.slice(-MSG_CAP);
  selectedMsgIdx = msgList.length - 1;
  renderMsgList();
  showMsgDetail();
}

// 时间戳格式化为 yyyy-MM-dd HH:mm:ss（兼容秒/毫秒时间戳）
function formatTimestamp(ts) {
  if (!ts) return '';
  const ms = Number(ts) < 1e12 ? Number(ts) * 1000 : Number(ts);
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function selectMsg(i) {
  if (!msgList[i]) return;
  selectedMsgIdx = i;
  renderMsgList();
  showMsgDetail();
}

function showMsgDetail() {
  const m = msgList[selectedMsgIdx];
  if (!m) {
    $('msg-detail-head').textContent = '';
    $('msg-detail-pre').textContent = '未选择消息';
    return;
  }
  const meta = msgMeta(m);
  $('msg-detail-head').textContent =
    `时间：${formatTimestamp(m.time)} ｜ 类型：${meta.type} ｜ 协议：${meta.name}（${m.id}）`;
  $('msg-detail-pre').textContent = typeof m.content === 'string' ? m.content : JSON.stringify(m.content, null, 2);
}

// 拖拽日志面板上边缘调整高度
(function initLogResize() {
  const handle = $('log-resize');
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    const panel = $('log-panel');
    const startY = e.clientY;
    const startH = panel.offsetHeight;
    handle.classList.add('dragging');
    const onMove = ev => {
      const h = Math.max(80, Math.min(window.innerHeight * 0.6, startH + (startY - ev.clientY)));
      panel.style.height = h + 'px';
    };
    const onUp = () => {
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();

// ============================================================
//  执行面板：同源请求 /case、/node；轮询 /status、/message、/logs
//  参数带类型（string/number/boolean），完整请求仅 open_id，
//  执行时全部参数以 [{key, type, value}] 数组打包进 body 的 params 字段下发
// ============================================================
// 默认参数：open_id（固定参数不可删除）在首位，addr（服务器地址 ip:port）其次，类型均为 string
function defaultExecParams() {
  return [
    { key: 'open_id', type: 'string', value: '10001', locked: true },
    { key: 'addr', type: 'string', value: '127.0.0.1:20013' },
  ];
}

// 参数列表规范化：open_id 永远在第一位且不可删除（locked 标记不随存档持久化，读档后重建），
// 过滤掉编辑过程中产生的无名参数
function normalizeExecParams(params) {
  const list = (Array.isArray(params) ? params : []).filter(p => p && p.key);
  const openid = list.find(p => p.key === 'open_id');
  const rest = list.filter(p => p.key !== 'open_id');
  return [
    { key: 'open_id', type: 'string', value: openid ? openid.value : '10001', locked: true },
    ...rest.map(p => ({ key: p.key, type: p.type || 'string', value: p.value })),
  ];
}

const execOpts = { openid: '10001', params: defaultExecParams(), interval: 1000, debug: true };  // 记住上次配置（openid 为旧配置兼容字段；interval=运行频率ms；debug=子case是否跳转）
const EXEC_PARAM_TYPES = ['string', 'number', 'boolean'];   // 参数类型选项
let execMode = 'case';     // 'case' | 'node'
let execNodeId = null;     // 节点模式下待执行的节点 id
let lastExecPath = null;   // 上次执行的请求路径（节点▶直执行复用，强制换成/node路径）
const dblClickTracker = {};   // CASE 节点双击检测：{ 'n<id>': 上次 mousedown 时间戳 }

// 上次执行路径换成 /node（保留查询参数），供节点▶直执行
function lastExecNodeUrl() {
  const q = lastExecPath.indexOf('?');
  return '/node' + (q >= 0 ? lastExecPath.slice(q) : '');
}

function showExecPanel(urlPath, nodeId) {
  execMode = urlPath;
  execNodeId = nodeId !== undefined ? nodeId : null;
  // 老配置迁移：无参数时初始化默认参数；有参数时规范化（open_id 首位且不可删除）
  execOpts.params = (Array.isArray(execOpts.params) && execOpts.params.length)
    ? normalizeExecParams(execOpts.params)
    : defaultExecParams();
  showModalFrame({
    title: `设置`,
    body: `
        <div class="io-row">
          <div class="field" style="flex:0 0 140px"><label>运行频率(ms)</label>
            <input type="text" id="exec-interval" value="${escapeAttr(execOpts.interval)}" oninput="execOptionChanged()"></div>
          <div class="field" style="flex:1;display:flex;align-items:flex-end;padding-bottom:5px">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:400">
              <input type="checkbox" id="exec-debug" ${execOpts.debug ? 'checked' : ''} onchange="execOptionChanged()" style="width:auto;margin:0">
              <span>调试模式（调试画布随用例跳转，子用例按设置频率执行，否则用例加快执行）</span>
            </label>
          </div>
        </div>
        <div class="field"><label>输入参数列表（类型决定下发值格式：string 原样 / number 转数字 / boolean 转真假）</label>
          <div id="exec-params"></div>
          <button class="add-btn" onclick="addExecParam()">+ 添加参数</button>
        </div>
        <div class="field" id="exec-subcases-wrap"><label>子CASE参数（key 为 子用例名.参数名，只读；仅可修改值）</label>
          <div id="exec-subcase-params"></div>
        </div>
        <div class="field"><label>完整请求</label>
          <div class="exec-preview" id="exec-preview"></div>
        </div>
        <div class="field" id="exec-result-wrap" style="display:none"><label>执行结果</label>
          <div class="exec-result" id="exec-result"></div>
        </div>`,
    foot: `<button class="primary" onclick="doExecute()">运行</button>
           <button class="secondary" onclick="saveEditorFile()">保存</button>
           <button class="secondary" onclick="closeModal()">取消</button>`,
  });
  execOpts.params.forEach(p => addExecParam(p.key, p.type, p.value, p.locked));

// ============================================================
//  子CASE参数：展示画布上 CASE 节点所引用子用例的「执行面板参数」
//  key 与类型只读（子用例定义），仅可修改值；仅更新内存缓存，不写回子用例存档
// ============================================================
// 收集 CASE 节点引用的子用例的执行参数：[{caseName, key, type, value}]
// open_id 与 addr 为通用参数（父参数区已有），不在子CASE参数区重复展示
function collectSubCaseParams() {
  // CASE 节点引用的子用例名集合
  const caseNames = new Set();
  for (const node of Object.values(state.nodes)) {
    if (node.type !== 'CASE' || !node.data.case) continue;
    caseNames.add(node.data.case);
  }
  const rows = [];
  for (const sc of subCases) {
    if (!caseNames.has(sc.name) || !sc.exec || !Array.isArray(sc.exec.params)) continue;
    for (const p of sc.exec.params) {
      if (!p.key || p.key === 'open_id' || p.key === 'addr') continue;
      rows.push({ caseName: sc.name, key: p.key, type: p.type || 'string', value: p.value });
    }
  }
  return rows;
}

// 修改子CASE执行参数：只更新内存中的 subCases 缓存（刷新后随重新扫描恢复存档值）
function subCaseParamChanged(caseName, key, value) {
  const sc = subCases.find(s => s.name === caseName);
  if (!sc || !sc.exec || !Array.isArray(sc.exec.params)) return;
  const p = sc.exec.params.find(p => p.key === key);
  if (p) p.value = value;
}

function renderSubCaseParams() {
  const box = $('exec-subcase-params');
  if (!box) return;
  const rows = collectSubCaseParams();
  const wrap = $('exec-subcases-wrap');
  if (!rows.length) {
    wrap.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  wrap.style.display = '';
  box.innerHTML = rows.map(({ caseName, key, type, value }) => {
    const displayKey = `${caseName}.${key}`;
    return `<div class="exec-row">
      <input class="er-key" value="${escapeAttr(displayKey)}" readonly title="子CASE参数名（只读）" style="color:#888;background:#252526">
      <select class="er-type" disabled title="类型（子CASE定义，不可修改）">${EXEC_PARAM_TYPES.map(t => `<option ${t === type ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <input class="er-val" value="${escapeAttr(value)}" oninput="subCaseParamChanged('${escapeAttr(caseName)}','${escapeAttr(key)}',this.value)">
    </div>`;
  }).join('');
}

function addExecParam(key, type, value, locked) {
  const row = document.createElement('div');
  row.className = 'exec-row';
  row.innerHTML = `<input class="er-key" placeholder="参数名" value="${escapeAttr(key || '')}" ${locked ? 'readonly title="固定参数，不可删除" style="color:#888;background:#252526"' : ''} oninput="execParamChanged()">
    <select class="er-type" onchange="execParamChanged()">${EXEC_PARAM_TYPES.map(t => `<option ${t === (type || 'string') ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <input class="er-val" placeholder="参数值" value="${escapeAttr(value || '')}" oninput="execParamChanged()">
    ${locked ? '' : `<button class="del-btn" onclick="this.parentElement.remove();execParamChanged()" title="删除">×</button>`}`;
  $('exec-params').appendChild(row);
  execParamChanged();
}

// 参数变更时实时保存到内存（无需点击执行，重新打开面板即回填）
function execParamChanged() {
  execOpts.params = collectExecParams();
  updateExecPreview();
}

// 运行频率/调试开关变更（面板内实时保存）
function execOptionChanged() {
  const itv = parseInt($('exec-interval').value);
  execOpts.interval = Number.isNaN(itv) || itv <= 0 ? 1000 : itv;
  execOpts.debug = $('exec-debug').checked;
  updateExecPreview();
}

function collectExecParams() {
  const rows = [];
  document.querySelectorAll('#exec-params .exec-row').forEach(row => {
    const key = row.querySelector('.er-key').value.trim();
    if (key) rows.push({ key, type: row.querySelector('.er-type').value, value: row.querySelector('.er-val').value });
  });
  return rows;
}

// 合并父子 case 的参数：父（当前执行面板输入参数）优先，子 case 按收集顺序后者覆盖前者，同名 key 只保留一个
// 按类型转换参数值：string 原样、number 转数字（失败回退字符串）、boolean 转真假
function castParamValue(type, value) {
  const v = String(value);
  if (type === 'number') {
    const num = parseFloat(v);
    return Number.isNaN(num) ? v : num;
  }
  if (type === 'boolean') {
    const lv = v.trim().toLowerCase();
    if (['true', '1', 'yes', 'on'].includes(lv)) return true;
    if (['false', '0', 'no', 'off', ''].includes(lv)) return false;
    return v;
  }
  return v;   // string 原样
}

// 合并父子 case 的参数：父（当前执行面板输入参数）优先，子 case 按收集顺序后者覆盖前者，同名 key 只保留一个
// 返回 [{key, type, value}]（保留类型）。父参数读 execOpts.params（内存），
// 面板未打开（顶栏直运行/节点▶直执行）时 DOM 不存在，从 DOM 读会拿到空导致 args 丢参
function mergeExecParams() {
  const merged = {};   // key -> {key, type, value}
  // 子 case 参数先放入（按收集顺序，重复 key 后者覆盖前者）
  collectSubCaseParams().forEach(p => { merged[p.key] = { key: p.key, type: p.type || 'string', value: p.value }; });
  // 父参数后放入，覆盖同名子参数（含类型）
  (execOpts.params || []).forEach(p => {
    if (!p.key) return;
    merged[p.key] = { key: p.key, type: p.type || 'string', value: p.value };
  });
  return Object.values(merged);
}

// 请求路径：同源（/case 或 /node），查询串带 open_id、运行频率 interval、调试开关 debug
function buildExecUrl() {
  const urlPath = execMode === 'node' ? 'node' : 'case';
  const query = [];
  // open_id 从参数列表读取（面板打开时读 DOM，未开时读内存）
  const panelOpen = !!document.querySelector('#exec-params .er-key');
  let openId = '';
  const collect = panelOpen ? collectExecParams() : (execOpts.params || []);
  for (const p of collect) {
    if (p.key === 'open_id') { openId = p.value; break; }
  }
  if (!openId && execOpts.openid) openId = execOpts.openid;   // 兼容：参数列表无 open_id 时用旧配置
  if (openId) query.push(`open_id=${encodeURIComponent(openId)}`);
  if (execOpts.interval) query.push(`interval=${encodeURIComponent(execOpts.interval)}`);
  query.push(`debug=${execOpts.debug ? '1' : '0'}`);
  return `/${urlPath}${query.length ? '?' + query.join('&') : ''}`;
}

// 运行/停止合一按钮：未运行时点运行，运行中变红色停止，点击即停止
function updateRunBtn() {
  const btn = $('exec-run');
  if (!btn) return;
  btn.textContent = execActive ? '停止' : '运行';
  btn.className = execActive ? 'stop' : 'run';
  btn.title = execActive ? '停止运行' : '运行当前用例';
}

function execRunOrStop() {
  if (execActive) {
    stopExecute();
  } else {
    doExecute();
  }
}

function updateExecPreview() {
  const url = buildExecUrl();
  $('exec-preview').innerHTML = url
    ? `<a href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>`
    : '';
}

// 执行参数打包：父子 case 参数合并后，以 [{key, type, value}] 数组格式放进 body 的 params 字段
function buildExecArgs() {
  return mergeExecParams().map(p => ({ key: p.key, type: p.type || 'string', value: p.value }));
}

async function doExecute(urlOverride) {
  const url = urlOverride || buildExecUrl();
  lastExecPath = url;   // 记住本次请求路径，供节点▶直执行复用
  // 记住本次配置：面板打开时从 DOM 回读，面板未打开时跳过（execOpts 已是最新）
  const panelOpen = !!document.querySelector('#exec-params .er-key');
  if (!urlOverride && panelOpen) {
    execOpts.params = collectExecParams();
  }
  appendLog(`执行 ${url}`);
  // 组装请求体：case = 用例导出 + args（全部参数按类型转换）；node = 单节点配置
  let body = null;
  if (execMode === 'node') {
    const conf = exportNode(execNodeId);
    if (!conf) { uiAlert('节点不存在或已被删除'); return; }
    body = JSON.stringify(conf);
  } else {
    execNodeState = {};
    execNoRobot = false;
    refreshExecBadge();
    // 调试开始：记录根用例并快照画布（进入子用例/停止后返回时还原）
    execRootCase = state.caseName;
    execRootSnapshot = buildEditorData();
    caseViewCurrent = state.caseName;
    execNodeStateByCase = { [state.caseName]: {} };
    const data = buildExecExportData();
    data.params = buildExecArgs();   // 所有定义参数打包到 params（[{key, type, value}] 数组格式）
    body = JSON.stringify(data);
  }
  const wrap = $('exec-result-wrap'), box = $('exec-result');
  if (box) {   // 直执行时面板未打开，结果仅写日志
    wrap.style.display = '';
    box.textContent = '执行中...';
  }
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    const text = await res.text();
    const respText = text.length > 800 ? text.substring(0, 800) + ' ...' : text;
    appendLog(`状态码 ${res.status} ｜ 返回 ${respText}`);
    if (box) box.textContent = `状态码 ${res.status}\n${respText}`;
    // 用例模式：提交成功后进入轮询，绘制执行状态
    if (execMode !== 'node') {
      let data = null;
      try { data = JSON.parse(text); } catch (e) {}
      if (data && data.code === 0) {
        execActive = true;      // 机器人已创建（出错时服务端也不会清理，停止按钮保持可用）
        updateRunBtn();
        renderNodes();          // 节点▶按钮从灰色切换为可点击绿色
        startExecPolling();
        closeModal();
      }
    }
  } catch (e) {
    appendLog(`请求失败：${e.message}`);
    if (box) box.textContent = `请求失败：${e.message}\n（可能是服务未启动或跨域限制，可点击上方链接直接打开）`;
  }
}

// ============================================================
//  执行状态轮询：每秒拉取 /status 并在画布上绘制节点状态
// ============================================================
let execPollTimer = null;
let execNodeState = {};       // nodeId -> 'running' | 'ok' | 'err'（当前画布用例的状态事件累积）
let execActive = false;       // 机器人是否已在服务器创建（控制停止按钮显隐)
let execNoRobot = false;      // robot not exist 提示去重
let execRootCase = null;      // 正在调试的根用例名（执行开始时的画布用例）
let execRootSnapshot = null;  // 调试开始时的根用例画布快照（进入子用例/停止后返回时还原）
let caseViewCurrent = null;   // 画布当前显示的用例名（调试进入子用例时与根用例名不同）
let execNodeStateByCase = {}; // 调试期间节点状态按用例名分桶：{ caseName: {nodeId: state} }
const caseViewCache = {};     // 调试期间子用例画布缓存 { caseName: editorData }

function startExecPolling() {
  stopExecPolling();
  appendLog('开始轮询执行状态...', false);
  execPollTimer = setInterval(pollExecStatus, 1000);
  pollExecStatus();
}

function stopExecPolling() {
  if (execPollTimer) {
    clearInterval(execPollTimer);
    execPollTimer = null;
  }
}

// 从参数列表读取 open_id 值（execOpts.params 中的 open_id 参数；兼容旧配置 openid 字段）
function getOpenId() {
  const p = (execOpts.params || []).find(p => p.key === 'open_id');
  return (p ? String(p.value) : '') || execOpts.openid || '';
}

async function pollExecStatus() {
  const openId = getOpenId();
  const url = `/status?open_id=${encodeURIComponent(openId)}`;
  try {
    const res = await fetch(url, { method: 'GET' });
    const data = await res.json();
    if (data.code !== 0) {
      // 不自动停止轮询（robot 可能重新创建），仅状态变化时提示一次
      if (!execNoRobot) {
        execNoRobot = true;
        appendLog(`状态轮询：${data.msg || 'robot not exist'}`, false);
      }
      return;
    }
    execNoRobot = false;
    pollExecMessages();   // 与状态轮询同频（每秒），服务端返回即增量，失败静默
    pollRemoteLogs();     // 远程日志与消息同频拉取，服务端排空式返回即增量，失败仅提示一次
    // 服务端增量返回状态事件 [{case, node, id, state}]，排空式取走即新，无需去重
    const events = Array.isArray(data.msg) ? data.msg : [];
    if (!events.length) return;
    // 每条事件即一次状态变化：按状态着色写日志（节点名由服务端下发）；failed 事件带 err 字段（错误信息）
    const ownEvents = [];
    for (const ev of events) {
      const mapped = EXEC_STATE_MAP[ev.state];
      const st = mapped || ev.state;
      const text = EXEC_STATUS_TEXT[st] || ev.state;
      const cls = mapped ? 'log-' + mapped : '';
      const evCase = ev.case || state.caseName;
      const errSuffix = ev.err ? `\n    └ 错误: ${ev.err}` : '';
      if (evCase !== state.caseName) {
        appendLog(`[子用例 ${evCase}] 节点 #${ev.id} (${ev.node || '未知节点'}) ${text}${errSuffix}`, false, cls);
      } else {
        appendLog(`节点 #${ev.id} (${ev.node || '未知节点'}) ${text}${errSuffix}`, false, cls);
      }
      ownEvents.push(ev);
    }
    applyExecStatus(ownEvents);
  } catch (e) {
    // 请求失败不停止轮询，下一秒自动重试，仅失败开始时提示一次
  }
}

// 拉取执行消息：GET /message（服务端 fetch_messages 排空式返回，拿到即增量）
async function pollExecMessages() {
  const openId = getOpenId();
  const url = `/message?open_id=${encodeURIComponent(openId)}`;
  try {
    const res = await fetch(url, { method: 'GET' });
    const data = await res.json();
    if (data.code !== 0 || !Array.isArray(data.msg) || !data.msg.length) return;
    if (!Object.keys(protoDefs).length && !msgProtoHinted) {
      msgProtoHinted = true;
      appendLog('提示：未载入协议，消息列表无法解析协议名与类型', false);
    }
    // 只存原始 cmd_id/data/time，协议名与类型在渲染时动态反查（协议后载入也能补全）
    appendMsgs(data.msg.map(m => ({ id: m.cmd_id, content: m.data, time: m.time })));
  } catch (e) { /* 消息拉取失败不打断执行轮询，下一秒自动重试 */ }
}

// ============================================================
//  远程日志 Tab：轮询 /logs 展示服务器端机器人运行日志
//  服务端 fetch_robot_logs 排空式返回 [{log, time, lvl}]，拿到即增量
//  轮询有两条触发链路：执行状态轮询（后台持续累积）+ Tab 激活独立轮询
// ============================================================
function clearRemoteLog() {
  $('tab-rlog').textContent = '';
}

// 远程日志等级 → 显示样式：info 白、debug 蓝、dump 青、warn 黄、err 红、fatal 亮红加粗，未知等级用默认色
const RLOG_LVL_CLASS = {
  info: 'rlog-info', debug: 'rlog-debug', dump: 'rlog-dump',
  warn: 'rlog-warn', warning: 'rlog-warn',
  err: 'rlog-err', error: 'rlog-err',
  fatal: 'rlog-fatal', critical: 'rlog-fatal',
};

// 追加单行远程日志（time/lvl 可选，用于提示类文案）
function appendRemoteLine(text, cls, time, lvl) {
  const panel = $('log-panel');
  if (!panel.classList.contains('show')) panel.classList.add('show');   // 有新日志时自动展开面板
  const box = $('tab-rlog');
  const line = document.createElement('div');
  line.className = 'log-line' + (cls ? ' ' + cls : '');
  const head = time !== undefined
    ? `[${formatTimestamp(time)}] [${String(lvl || 'info').toUpperCase().padEnd(5)}] `
    : '';
  line.textContent = head + text;
  box.appendChild(line);
  while (box.childElementCount > 1000) box.removeChild(box.firstChild);   // 限制历史行数
  if (activeLogTab === 'rlog') box.scrollTop = box.scrollHeight;   // 仅当前 Tab 可见时自动滚动
}

function appendRemoteLogs(items) {
  if (!items || !items.length) return;
  for (const it of items) {
    const lvl = String(it.lvl || 'info').toLowerCase();
    const text = typeof it.log === 'string' ? it.log : JSON.stringify(it.log);
    appendRemoteLine(text, RLOG_LVL_CLASS[lvl], it.time, lvl);
  }
}

// 拉取远程日志：GET /logs，参数与 /message 一致（open_id）
// 与消息轮询同生命周期：由执行状态轮询每秒驱动，停止执行后不再拉取
async function pollRemoteLogs() {
  const openId = getOpenId();
  const url = `/logs?open_id=${encodeURIComponent(openId)}`;
  try {
    const res = await fetch(url, { method: 'GET' });
    const data = await res.json();
    if (data.code !== 0) { return; }
    appendRemoteLogs(data.msg);
  } catch (e) { /* 日志拉取失败不打断执行轮询，下一秒自动重试 */ }
}

// 服务端状态事件 → 编辑器徽标状态映射
const EXEC_STATE_MAP = { running: 'running', success: 'ok', failed: 'err' };

// 状态事件应用到画布节点（服务端增量事件，按节点累积最新状态）。
// 事件带 case 名（子用例节点带子用例名，根用例节点 case 为空）：
// 调试期间按用例分桶记录状态，画布跟随最新有事件的用例切换展示
function applyExecStatus(events) {
  if (!execRootCase) {   // 无调试上下文（理论不会发生），按旧行为处理
    for (const ev of events) {
      const st = EXEC_STATE_MAP[ev.state];
      if (st) execNodeState[ev.id] = st === 'err' && ev.err ? { st, err: ev.err } : st;
    }
    refreshExecBadge();
    return;
  }
  let latestCase = null;
  for (const ev of events) {
    const st = EXEC_STATE_MAP[ev.state];
    if (!st) continue;
    const evCase = ev.case || execRootCase;
    if (!execNodeStateByCase[evCase]) execNodeStateByCase[evCase] = {};
    // failed 事件带 err：与状态一起存（节点恢复 running 时清掉旧 err）
    execNodeStateByCase[evCase][ev.id] = st === 'err' && ev.err ? { st, err: ev.err } : st;
    latestCase = evCase;
  }
  // 事件来自画布以外的用例：仅调试模式（execOpts.debug）切换画布跟随，否则留在当前用例
  if (execOpts.debug) {
    if (latestCase && latestCase !== caseViewCurrent) {
      switchCaseView(latestCase);
    } else if (latestCase === execRootCase && caseViewCurrent !== execRootCase) {
      // 最新事件回到根用例：还原根用例画布
      switchCaseView(execRootCase, true);
    }
  }
  // execNodeState 必须与当前用例的分桶是同一个对象（引用），
  // 否则本轮写入只进了分桶，refreshExecBadge 读的是旧拷贝，徽标不更新
  if (!execNodeStateByCase[caseViewCurrent]) execNodeStateByCase[caseViewCurrent] = {};
  execNodeState = execNodeStateByCase[caseViewCurrent];
  refreshExecBadge();
}

// 切换画布显示的用例：target=目标用例名；isRoot=true 时从快照还原根用例
function switchCaseView(target, isRoot) {
  // 调试期间：离开子用例时保存其画布（还原时保持执行状态叠加后的样子）
  if (caseViewCurrent && caseViewCurrent !== execRootCase && caseViewCurrent !== target) {
    caseViewCache[caseViewCurrent] = JSON.parse(JSON.stringify(buildEditorData()));
  }
  caseViewCurrent = target;
  // 调试视图切换：skipExec=true，不还原子用例/根用例存档的 exec 配置（保持当前调试参数）
  if (isRoot && execRootSnapshot) {
    applyEditorData(JSON.parse(JSON.stringify(execRootSnapshot)), true);
  } else if (caseViewCache[target]) {
    applyEditorData(JSON.parse(JSON.stringify(caseViewCache[target])), true);
  } else {
    // 子用例首次进入：从服务器缓存加载
    const sc = subCases.find(s => s.name === target);
    if (!sc) { toast(`子用例「${target}」不在已加载列表中`); return; }
    const content = typeof sc.content === 'string' ? sc.content : JSON.stringify(sc.content);
    const data = JSON.parse(content);
    if (data.editor === 'quanta-robot-node-editor') applyEditorData(data, true);
    else if (data.nodes) applyCaseData(data);
  }
  // 应用该用例已累积的节点状态（引用分桶，后续事件直接写入同一对象）
  if (!execNodeStateByCase[target]) execNodeStateByCase[target] = {};
  execNodeState = execNodeStateByCase[target];
  refreshExecBadge();
}

const EXEC_STATUS_TEXT = { running: '运行中', ok: '成功', err: '失败' };

// 应用节点执行状态徽标与边框（renderNodes 重建与轮询刷新共用）
// execNodeState[id] 为状态字符串，failed 事件带 err 时为 { st: 'err', err: 错误信息 }
function applyExecBadge(el, id) {
  el.classList.remove('exec-running', 'exec-ok', 'exec-err');
  const old = el.querySelector('.exec-badge');
  if (old) old.remove();
  const oldErr = el.querySelector('.exec-err-line');
  if (oldErr) oldErr.remove();
  const raw = execNodeState[id];
  if (!raw) return;
  const s = typeof raw === 'object' ? raw.st : raw;
  const err = typeof raw === 'object' ? raw.err : null;
  el.classList.add('exec-' + s);
  const head = el.querySelector('.node-head');
  if (head) {
    const badge = document.createElement('span');
    badge.className = 'exec-badge exec-badge-' + s;
    badge.textContent = EXEC_STATUS_TEXT[s];
    head.appendChild(badge);
  }
  // 失败且带错误信息：错误内容直接显示在节点内容区（红色小字，悬停弹出自定义大号红字 tooltip）
  if (err) {
    const body = el.querySelector('.node-body');
    if (body) {
      const line = document.createElement('div');
      line.className = 'exec-err-line';
      const text = document.createElement('span');
      text.className = 'err-text';
      text.textContent = err;
      const tip = document.createElement('div');
      tip.className = 'err-tip';
      tip.textContent = err;
      line.appendChild(text);
      line.appendChild(tip);
      body.appendChild(line);
    }
  }
}

function refreshExecBadge() {
  for (const el of canvas.querySelectorAll('.node')) {
    applyExecBadge(el, el.dataset.id);
  }
}

// ============================================================
//  辅助
// ============================================================
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g,'&quot;'); }
function toast(msg) {
  appendLog(msg, false);  // 弹出提示同步写一份到日志
  const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800);
}

// 弹窗提示同步写一份到日志
function uiAlert(msg) {
  appendLog(msg, false);
  alert(msg);
}

// 停止执行：通知服务器销毁机器人，并复位画布状态
async function stopExecute() {
  if (!execActive) {
    toast('当前没有正在执行的用例');
    return;
  }
  const openId = getOpenId();
  const url = `/stop?open_id=${encodeURIComponent(openId)}`;
  appendLog(`停止执行 ${url}`, false);
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ open_id: openId }) });
    const data = await res.json();
    appendLog(`停止结果：${data.msg || 'ok'}`, false);
  } catch (e) {
    appendLog(`停止请求失败：${e.message}`);
  }
  execActive = false;
  stopExecPolling();
  execNodeState = {};
  execNoRobot = false;
  lastExecPath = null;   // 停止后清空执行状态：节点▶不再直执行，重新弹面板配置
  // 停止后回到根用例画布（调试期间若进入了子用例）
  if (execRootCase && caseViewCurrent !== execRootCase && execRootSnapshot) {
    caseViewCurrent = execRootCase;
    applyEditorData(JSON.parse(JSON.stringify(execRootSnapshot)));
  }
  execRootCase = null;
  execRootSnapshot = null;
  execNodeStateByCase = {};
  for (const k of Object.keys(caseViewCache)) delete caseViewCache[k];
  renderNodes();   // 节点▶按钮从可点击绿色切回灰色
  updateRunBtn();
  toast('已停止执行');
}

// 启动
init();
renderGroupOptions();
initFromServer();
</script>
</body>
</html>
